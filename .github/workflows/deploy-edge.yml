# Deploys Supabase Edge Functions from GitHub `main` (single source of truth).
# On any push touching supabase/functions/, deploys the PRODUCTION functions.
#
# NOT "all functions". It used to be: `supabase functions deploy` with no
# argument list deploys every directory under supabase/functions/, and one of
# those directories is ci-bootstrap — a function whose entire job is to hand a
# GitHub-Actions OIDC caller the project's service-role key. Its own header
# says "deployed ONLY to the staging project. Never deployed to prod", and
# nothing enforced that, so production was shipping an endpoint that vends
# production credentials to anyone able to trigger staging-integration.yml.
#
# So the deploy set is now explicit, and it is CLOSED: every directory must be
# classified as production or staging-only, and an unclassified one fails the
# build. A new function therefore cannot be silently skipped (the failure mode
# of a plain allow-list) OR silently shipped to prod (the failure mode of the
# bare deploy). ci-bootstrap also self-checks the project it is running on, so
# neither layer is load-bearing alone.
#
# One-time setup — repo Settings → Secrets and variables → Actions:
#   SUPABASE_ACCESS_TOKEN  — a Supabase personal access token (sbp_…).
# Project ref is non-secret and pinned below.

name: Deploy edge functions
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['supabase/functions/**', '.github/workflows/deploy-edge.yml']

concurrency:
  group: deploy-edge
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Classify every function directory
        run: |
          set -euo pipefail
          # Staging-only: MUST NOT reach production. Adding a name here is a
          # security decision — say why in the same commit.
          #   ci-bootstrap — vends the project's service-role key to CI.
          STAGING_ONLY="ci-bootstrap"
          PROD="admin admin-metrics billing billing-webhook brand-logo clip-asset dna-poll \
                editor-output generate-blueprint generate-thumbnail ingest-reference \
                referral review social source-asset start-dna start-editor-v2"

          unclassified=""
          for d in supabase/functions/*/; do
            name="$(basename "$d")"
            # _shared is a library directory, not a deployable function.
            [ "$name" = "_shared" ] && continue
            case " $PROD $STAGING_ONLY " in
              *" $name "*) ;;
              *) unclassified="$unclassified $name" ;;
            esac
          done
          if [ -n "$unclassified" ]; then
            echo "::error::Unclassified edge function(s):$unclassified. Add each to PROD or STAGING_ONLY in .github/workflows/deploy-edge.yml. Refusing to guess — guessing wrong ships a staging-only function to production."
            exit 1
          fi
          # Belt and braces: prove the deploy set excludes every staging-only name.
          for s in $STAGING_ONLY; do
            case " $PROD " in
              *" $s "*) echo "::error::$s is in BOTH lists."; exit 1 ;;
            esac
          done
          echo "PROD_FUNCTIONS=$(echo $PROD | tr -s ' ')" >> "$GITHUB_ENV"
          echo "classified OK; deploying: $PROD"

      - name: Deploy production edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set — add it in repo Settings → Secrets → Actions."
            exit 1
          fi
          # Named explicitly. A bare `supabase functions deploy` deploys every
          # directory, which is how ci-bootstrap reached production.
          supabase functions deploy $PROD_FUNCTIONS --project-ref jmdecibuytznsonrasxw
