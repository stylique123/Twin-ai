# Deploys Supabase Edge Functions from GitHub `main` (single source of truth).
# On any push touching supabase/functions/, deploys the PRODUCTION functions.
#
# NOT "all functions". It used to be: `supabase functions deploy` with no
# argument list deploys every directory under supabase/functions/, and one of
# those directories is ci-bootstrap — a function whose entire job is to hand a
# GitHub-Actions OIDC caller the project's service-role key. Its own header
# says "deployed ONLY to the staging project. Never deployed to prod", and
# nothing enforced that, so production was shipping an endpoint that vends
# production credentials to anyone able to trigger staging-integration.yml.
#
# So the deploy set is now explicit, and it is CLOSED: every directory must be
# classified as production or staging-only, and an unclassified one fails the
# build. A new function therefore cannot be silently skipped (the failure mode
# of a plain allow-list) OR silently shipped to prod (the failure mode of the
# bare deploy). ci-bootstrap also self-checks the project it is running on, so
# neither layer is load-bearing alone.
#
# One-time setup — repo Settings → Secrets and variables → Actions:
#   SUPABASE_ACCESS_TOKEN  — a Supabase personal access token (sbp_…).
# Project ref is non-secret and pinned below.

name: Deploy edge functions
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['supabase/functions/**', '.github/workflows/deploy-edge.yml']

concurrency:
  group: deploy-edge
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Classify every function directory
        run: |
          set -euo pipefail
          # Staging-only: MUST NOT reach production. Adding a name here is a
          # security decision — say why in the same commit.
          #   ci-bootstrap — vends the project's service-role key to CI.
          STAGING_ONLY="ci-bootstrap"
          # product-image — the Product Library's photo upload. Production: the
          # client has no insert policy on the `edits` bucket, so this
          # service-role hop is the only way a creator's own photograph of their
          # product reaches storage. Owner-prefixed path, content-type allow-list.
          # pilot-review — the #58 visual pilot's labelling page. PRODUCTION on
          # purpose: the review is hosted inside Twin so the owner can open it
          # from anywhere, and the previous version served from a container's
          # localhost, which nobody but that container could reach. It carries
          # no anonymous path — every action re-checks platform_admins with the
          # service role before it reads or writes anything.
          # pilot-start — the ONLY way to start a #58 pilot. PRODUCTION on
          # purpose, and it REPLACES a laptop terminal holding a service-role
          # key. It is deliberately crippled: three accepted keys, unknown keys
          # REFUSED rather than ignored, assess_reference only, frames:true and
          # the whole payload constructed server-side, size capped at the pilot
          # ceiling, one active run at a time, and a cost ceiling the caller
          # must state before anything is enqueued. Same platform_admins check
          # as pilot-review, with the service role, before any table is read.
          # watched-session — D1's record. PRODUCTION for the same reason as
          # pilot-review: a session served from a laptop dies with the process
          # and cannot be opened from anywhere else. Admin-gated, and the
          # observer must own the session they are writing to.
          # owner-console — what the owner still has to do, answered by the
          # database instead of by memory. READ-ONLY: it starts nothing,
          # enqueues nothing and spends nothing, which is why a status page is
          # allowed to exist at all. Same platform_admins check with the service
          # role. PRODUCTION because the state it reports IS production's.
          PROD="admin admin-metrics billing billing-webhook brand-logo brand-truth clip-asset \
                dna-poll editor-output generate-blueprint generate-thumbnail ingest-reference \
                owner-console pilot-review pilot-start product-image referral review social \
                source-asset start-dna start-editor-v2 watched-session"

          unclassified=""
          for d in supabase/functions/*/; do
            name="$(basename "$d")"
            # _shared is a library directory, not a deployable function.
            [ "$name" = "_shared" ] && continue
            case " $PROD $STAGING_ONLY " in
              *" $name "*) ;;
              *) unclassified="$unclassified $name" ;;
            esac
          done
          if [ -n "$unclassified" ]; then
            echo "::error::Unclassified edge function(s):$unclassified. Add each to PROD or STAGING_ONLY in .github/workflows/deploy-edge.yml. Refusing to guess — guessing wrong ships a staging-only function to production."
            exit 1
          fi
          # Belt and braces: prove the deploy set excludes every staging-only name.
          for s in $STAGING_ONLY; do
            case " $PROD " in
              *" $s "*) echo "::error::$s is in BOTH lists."; exit 1 ;;
            esac
          done
          echo "PROD_FUNCTIONS=$(echo $PROD | tr -s ' ')" >> "$GITHUB_ENV"
          echo "classified OK; deploying: $PROD"

      # ── WHAT IS DEPLOYED, NOT ONLY WHAT IS COMMITTED ──────────────────────
      #
      # The classification above closes one direction: a repo directory that is
      # in neither list fails the build. It cannot see the other direction, and
      # production is currently carrying an example of it.
      #
      # `enqueue-autoedit` is ACTIVE on the production project, version 37, with
      # an entrypoint under /tmp — hand-deployed, never from CI. There is no such
      # directory in this repository and no commit has ever touched one. It is
      # unreviewable (nobody can read its source), unversioned (nothing pins what
      # it runs), and it drives the retired legacy editor. The only reason it is
      # currently harmless is that `reject_new_autoedit_job` refuses the jobs it
      # enqueues at the database — defence in depth held, which is not the same
      # as the endpoint being fine.
      #
      # So this step reads what the PROJECT has and compares it to what this file
      # classifies. A deployed function nobody committed is reported by name.
      #
      # RETIRED lists the ones already known and awaiting a deliberate delete —
      # they warn rather than fail, because failing here would block every
      # deploy on a cleanup that needs a human to authorise. Anything NOT in that
      # list and not in PROD fails: a new one appearing is exactly the event this
      # step exists to catch, and it must not be able to arrive quietly.
      - name: Deployed functions match what this file classifies
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          RETIRED="enqueue-autoedit"
          # `|| true` on BOTH halves is load-bearing. Under `set -euo pipefail` a
          # CLI that errored — an expired token, a rate limit, a flag that moved
          # in a new release — would fail this step and block every deploy on a
          # check that is advisory by design. This step exists to NAME a
          # deployed orphan, not to become a new way for shipping to stop.
          deployed="$( { supabase functions list --project-ref jmdecibuytznsonrasxw -o json 2>/dev/null || true; } \
            | { node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(JSON.parse(s).map(f=>f.slug).join(" "))}catch{}})' || true; } )"
          if [ -z "$deployed" ]; then
            echo "::warning::could not read the deployed function list — skipping the deployed-vs-classified check"
            exit 0
          fi
          unknown=""; retired_live=""
          for name in $deployed; do
            case " $PROD_FUNCTIONS " in *" $name "*) continue ;; esac
            case " $RETIRED " in *" $name "*) retired_live="$retired_live $name"; continue ;; esac
            unknown="$unknown $name"
          done
          for r in $retired_live; do
            echo "::warning::$r is deployed to production and exists in no commit. It is retired and awaiting deletion: supabase functions delete $r --project-ref jmdecibuytznsonrasxw"
          done
          if [ -n "$unknown" ]; then
            echo "::error::Deployed but not classified:$unknown. Either it belongs in PROD in this file, or it was hand-deployed and must be deleted. Refusing to leave a production endpoint whose source nobody can read."
            exit 1
          fi
          echo "deployed set matches (retired, pending delete:${retired_live:- none})"

      - name: Deploy production edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set — add it in repo Settings → Secrets → Actions."
            exit 1
          fi
          # Named explicitly. A bare `supabase functions deploy` deploys every
          # directory, which is how ci-bootstrap reached production.
          supabase functions deploy $PROD_FUNCTIONS --project-ref jmdecibuytznsonrasxw
