name: PR checks
# The safety net that was missing: nothing used to compile-check a PR, so a TS
# error in packages/shared or worker/ could merge to main and auto-deploy broken.
# Every deploy workflow triggers on push-to-main; this one gates the merge.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  web-and-shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Typecheck all workspaces
        run: npm run typecheck
      - name: Build web
        run: npm run web:build

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Typecheck worker
        working-directory: worker
        run: |
          npm ci
          npx tsc --noEmit

  # Focused automated tests for Part 1 (old-editor removal + retained-flow contract).
  # Shared: the client API surface can no longer construct an editor call, and the
  # recording/teleprompter data path still builds from a blueprint. Worker: the job
  # registry cannot claim `autoedit` and the editor env flags are gone.
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        # Node 22: the worker registry test transitively loads @supabase/supabase-js,
        # which needs a native WebSocket (Node 22+) — the same reason the worker's
        # Docker image is Node 22.
        with: { node-version: 22 }
      # ffmpeg: the worker's Phase-6 audio unit tests include a live-ffmpeg
      # fixture (deterministic PCM decode + ebur128) that proves the frozen
      # loudness/clipping math against real bytes. Absent ffmpeg the fixture
      # self-skips (see audio.test.ts), but CI installs it so the gate runs.
      #
      # Phase 8 adds a second, heavier reason: render-end-to-end.test.ts BUILDS A
      # VIDEO — it is the only gate outside the staging matrix that runs the
      # renderer, and it is what caught the crossfade timebase mismatch that
      # every graph-string test passed straight over.
      #
      # THE CAPTION FONTS ARE NOT INSTALLED VIA apt ON THIS RUNNER. This runner is
      # Ubuntu; the worker's Dockerfile is Debian bookworm
      # (worker/Dockerfile: FROM node:22-bookworm-slim), and Ubuntu's own package
      # repo ships DIFFERENT bytes for the nominally same font than Debian's does
      # — proven directly: render_catalog_v1.json is pinned from a real bookworm
      # build, and the VPS deploy failed with a digest mismatch the first time
      # this was measured on Ubuntu instead. Installing via `apt-get` here would
      # reproduce that exact bug in the other direction — CI green with fonts that
      # do not match what actually ships.
      #
      # So this runs the SAME base image and SAME install command the Dockerfile
      # uses, and copies the result onto the runner, rather than hardcoding a
      # Debian package URL/version that could silently drift out of sync with the
      # Dockerfile. Docker ships preinstalled on GitHub-hosted runners.
      - name: Install ffmpeg; fetch the caption fonts from the ACTUAL deploy image
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
          D=/usr/share/fonts/truetype/dejavu
          sudo mkdir -p "$D"
          docker run --rm -v "$D:/out" node:22-bookworm-slim bash -c \
            "apt-get update -qq && apt-get install -y -qq --no-install-recommends fonts-dejavu-core && cp /usr/share/fonts/truetype/dejavu/*.ttf /out/"
      - name: Install + test @twinai/shared
        run: |
          npm ci
          npm test -w @twinai/shared
      - name: Install + test worker
        working-directory: worker
        run: |
          npm ci
          npm test

  # Model-pin integrity (speech-6): the digest verifier, the bridge fail-closed
  # paths, and the pin/version coupling guard. All run OFFLINE with no model —
  # editor_speech.py returns exit 3 before faster-whisper is imported.
  model-pin-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # merge-base needed for the coupling check
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Verifier + bridge fail-closed tests (offline)
        run: |
          python worker/scripts/test_fetch_model.py
          python worker/scripts/test_editor_speech_pin.py
          python worker/scripts/test_editor_speech_offline.py
      - name: Visual bridge pin verification + canonical-json parity (offline, no cv2)
        run: python worker/scripts/test_editor_visual_offline.py
      - name: Model-pin / analyzer-version coupling (selftest + PR guard)
        run: |
          node scripts/ci/check_model_pin_coupling.mjs --selftest
          node scripts/ci/check_model_pin_coupling.mjs
      - name: Publish vps_bench.sh sha256 (for the founder's self-verifying download)
        run: |
          echo "vps_bench.sh sha256: $(sha256sum worker/scripts/vps_bench.sh | cut -d' ' -f1)"

  # Guard: the OLD AI editor AND the old manual/timeline/Refine/EDL editor were
  # removed (see docs/ai-editor-rebuild-status.md + docs/manual-editor-remnant-inventory.md).
  # Fail any change that reintroduces their entry points into live code. Historical
  # migrations and the removal docs are excluded on purpose; the new editor must
  # use new names, not resurrect these. NOTE: the generic word "timeline" is NOT
  # forbidden — the recording Scene Timeline and future internal planning code use
  # it legitimately; behavior is reviewed separately.
  no-legacy-editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No legacy editor references in live code
        run: |
          if grep -rnE 'enqueue-autoedit|handleAutoEdit|autoEditTake|autoEditFromPath|reEditWithEdl|fetchEdl|pollEditJob|EditDecisionList|ManualEditor|TimelineEditor|RefineEditor|manual-rerender|REVIDEO_URL|REVIDEO_TRUSTED|twinai-revideo' \
              apps/web/src packages/shared/src worker/src supabase/functions supabase/config.toml \
              --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=__tests__ --exclude='*.test.ts'; then
            echo '::error::Legacy editor reference detected — the old AI/manual editor was removed; do not reintroduce its entry points.'
            exit 1
          fi
          echo "clean: no legacy editor references"
      - name: Worker registry must not register autoedit
        run: |
          if grep -n "autoedit" worker/src/jobs/index.ts | grep -v "removed"; then
            echo '::error::autoedit handler reappeared in the worker registry.'
            exit 1
          fi
          echo "clean: worker registry has no autoedit handler"
      - name: Single deployment path (no second Fly/PaaS manifest; no retired job-type override)
        run: |
          node scripts/ci/check_single_deploy_path.mjs --selftest
          node scripts/ci/check_single_deploy_path.mjs
      # The merge gate decides whether a head may land at all, so its predicates
      # are exercised here rather than only in production. The cases that matter
      # are the fail-closed ones: no matrix run must read as "wait", never as
      # "fine", and an unrecognised conclusion must never read as success.
      - name: Staging-matrix gate predicates (offline selftest — silence is never a pass)
        run: node scripts/ci/staging_matrix_gate.mjs --selftest
      - name: VPS sign-off assertion logic (offline selftest — bad states must fail)
        run: bash worker/scripts/vps_signoff_assert.sh --selftest
      - name: VPS-diag authority (no caller SHA override; pinned strict host key)
        run: |
          node scripts/ci/check_vps_diag_authority.mjs --selftest
          node scripts/ci/check_vps_diag_authority.mjs
      # The retirement tooling can delete things on the box that runs production
      # renders. These freeze the properties that make that safe: the read-only
      # collector stays read-only, every mutating stage stays behind the confirm
      # phrase, no broad prune sweeps, and the executed commands keep coming from
      # the generated plan rather than a literal list.
      - name: VPS retirement safety (read-only collector; gated mutating stages)
        run: |
          node scripts/ci/check_vps_retire_safety.mjs --selftest
          node scripts/ci/check_vps_retire_safety.mjs
      - name: Pre-stop audit verdict (fail-closed; undetermined must block like routed)
        run: node scripts/ci/assert_pre_stop_audit.mjs --selftest
      - name: Acceptance baseline anchor (real field name; an unknown digest must fail)
        run: node scripts/ci/anchor_acceptance_baseline.mjs --selftest
      - name: VPS resource classifier + retirement plan + acceptance gate (offline selftests)
        run: |
          node scripts/ci/build_resource_inventory.mjs --selftest
          node scripts/ci/plan_retirement.mjs --selftest
          node scripts/ci/assert_vps_acceptance.mjs --selftest
      # These two carry the live-host safety argument and were running only on a
      # developer's machine: an unwired selftest is a selftest that has already
      # stopped protecting anything.
      #   route impact  — which Caddy route serves the target, and what patch is
      #                   safe; upstream deletions must be exact and descending.
      #   plan commands — the executor derives its shell from the same typed
      #                   objects the comparator authorises.
      #   structural    — a stage changed only what its bound plan permitted.
      - name: VPS route-impact classification + patch generation (offline selftest)
        run: node scripts/ci/assert_route_impact.mjs --selftest
      # The classifier's tests use FIXTURES, which pass whether or not the
      # extractor actually emits that shape. Both prior rejections of this work
      # were extractor defects a fixture cannot catch, so the extractor is run
      # for real here — its python is pulled out of the shell script and fed
      # synthetic configs on stdin. No host is contacted.
      - name: VPS route extractor (real program, synthetic configs)
        run: node scripts/ci/check_route_extractor.mjs
      # C0 — the Chrome exposure classifier. Severity is only as good as its
      # fail-closed cases, so those are what this exercises: a firewall with no
      # matching rule is UNDETERMINED rather than blocked, absent external
      # evidence is UNDETERMINED rather than safe, and an unread dependency
      # channel is "unknown", never "no dependency".
      - name: Chrome exposure classification (offline selftest)
        run: node scripts/ci/assert_chrome_exposure.mjs --selftest
      # R0 — retirement classification. The safety lives in the HOLD set: an
      # unread channel, an orphan of unproven ownership, a TwinAI-named image
      # kept for rollback, and a volume holding a database must never be
      # classified retire.
      - name: Stack retirement classification (offline selftest)
        run: node scripts/ci/assert_stack_retirement.mjs --selftest
      - name: VPS plan execution + structural delta (typed manifest, least privilege)
        run: |
          node scripts/ci/emit_plan_commands.mjs --selftest
          node scripts/ci/assert_structural_delta.mjs --selftest
          node scripts/ci/assert_cache_reclaim.mjs --selftest
      - name: Canonical docs free of stale legacy claims (Fly/Revideo/autoedit/3-type registry)
        run: |
          node scripts/ci/check_docs_no_stale_claims.mjs --selftest
          node scripts/ci/check_docs_no_stale_claims.mjs
      - name: Probe-residue classifier (partial/complete cleanup cannot silently pass)
        run: node scripts/prod-smoke/probe_residue_report.mjs --selftest
      - name: Takes storage-policy inventory (no client DELETE-capable policy; migration-derived)
        run: |
          node scripts/ci/check_takes_delete_policy.mjs --selftest
          node scripts/ci/check_takes_delete_policy.mjs
      - name: Prod-smoke residue failure-injection harness (real flow + observation truth table)
        run: node scripts/prod-smoke/residue_harness.mjs --selftest
      - name: Product-truth (no shipped-editor claims while the production editor is disabled)
        run: |
          node scripts/ci/check_product_truth.mjs --selftest
          node scripts/ci/check_product_truth.mjs
      - name: Activation gate (fail-closed flag, no web caller, scaffold completion, no premature output constraint)
        run: |
          node scripts/ci/check_activation_gate.mjs --selftest
          node scripts/ci/check_activation_gate.mjs
      - name: Analysis-layer consistency (face* naming, strict versions, partial ON CONFLICT predicates)
        run: |
          node scripts/ci/check_analysis_consistency.mjs --selftest
          node scripts/ci/check_analysis_consistency.mjs
      # Registering ONE analysis component used to mean editing twelve places
      # that each privately encoded the component namespace, none referencing
      # any other. Nothing compared them, so every disagreement surfaced ~40
      # minutes into a staging matrix run against real Gemini and ASR — four
      # runs for #242, each naming a symptom rather than the cause. This is the
      # comparison, offline and in under a second.
      - name: Analysis components agree with the frozen catalog (one namespace, twelve sites)
        run: |
          node scripts/ci/check_analysis_components.mjs --selftest
          node scripts/ci/check_analysis_components.mjs
      # Routing existed before its catalog did — a frozen constant, an env knob
      # at one call site, and an implicit fallthrough, with nothing comparing
      # them. This is the comparison, and it also stops the two pinned copies of
      # DIRECTOR_MODEL drifting from what the catalog records.
      - name: Model routing agrees with the code (one catalog; decide stays frozen)
        run: |
          node scripts/ci/check_model_routing.mjs --selftest
          node scripts/ci/check_model_routing.mjs
      - name: Build provenance (Docker npm-ci/lockfile, no dev deps, WORKER_GIT_SHA injection, OpenCV wheel hash)
        run: |
          node scripts/ci/check_build_provenance.mjs --selftest
          node scripts/ci/check_build_provenance.mjs
      - name: Phase-7 Gate 0 — Director envelope fits one inference (exact bytes + conservative token bound)
        run: node scripts/director-eval/count_tokens.mjs --selftest
      - name: Phase-7 Director quality-gate digest is immutable
        run: |
          node scripts/ci/check_quality_gate_digest.mjs --selftest
          node scripts/ci/check_quality_gate_digest.mjs
      - name: Phase-7 ci-bootstrap secret-key selection (fail-closed, no byte leak)
        run: node scripts/ci/check_ci_bootstrap_keyselect.mjs

  # Offline hostile suite for the production gate-probe predicates
  # (scripts/ci/gate_probe_assert.mjs — the exact module verify-prod-gate.yml
  # calls for every pass/fail decision). Runs entirely offline: no network, no
  # secrets, no production contact.
  gate-probe-assert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Gate-probe predicates (hostile selftest)
        run: node scripts/ci/gate_probe_assert.mjs --selftest

  # Gate-D + Gate-E: ephemeral-Postgres verification of the capture/validation RPC
  # matrix (0091) and the Decision v2 DB guard (0092), INCLUDING every mutation
  # control. These previously ran only locally — a migration edit could silently
  # break a DB guarantee with CI green. Now they gate every PR.
  db-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - name: Install dependencies (Gate-D's DB<->TS parity step needs esbuild)
        run: npm ci
      - name: Install PostgreSQL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql postgresql-contrib
      - name: Gate-D (capture/validation RPC matrix + negative controls)
        run: bash scripts/db-tests/gate-d/run.sh
      - name: Gate-E (Decision v2 DB guard + hostile matrix)
        run: bash scripts/db-tests/gate-e/run.sh
      # Gate-F was NOT in required CI until an audit pointed it out. It has been
      # green all along — because I ran it by hand on every Phase 8 head. That
      # is not a control: a future change can break 0094/0096 while every
      # required check stays green, and nobody would know until a render failed.
      - name: Gate-F (Phase 8 plan/output SQL, hostile + mutation controls)
        run: bash scripts/db-tests/gate-f/run.sh
      # Gate-G exists because 0102 was applied by NONE of the gates above, so
      # nothing in CI executed a line of it — and 0102 does not add an isolated
      # table, it REPLACES the stage guard every editor project transitions
      # through and the reconciler that decides which projects are dead. Its
      # load-bearing assertion is the one about projects NOT having a review:
      # `directing -> compiling` must stay legal, or the obvious implementation
      # strands every project already in flight.
      - name: Gate-G (review gate SQL — the pause, the submit RPC, the reconciler)
        run: bash scripts/db-tests/gate-g/run.sh
      # The migration-reconcile guard's LOCAL half: build the expected state for
      # 0090-0093 in a disposable database and run the full hostile suite (24
      # divergences + positive control + 3 mutation controls). No secrets, no
      # network, staging never touched. The staging comparison and the ledger
      # repair live in .github/workflows/migration-reconcile.yml.
      - name: migration-reconcile (expected-state build + hostile suite + mutation controls)
        run: bash scripts/db-tests/migration-reconcile/run.sh
      # migration-presence answers a different question — which committed
      # migrations a DEPLOYED database is missing — and it cannot run against one
      # from here: no credentials, and no reason to hand CI any. What runs here is
      # its selftest, which parses the REAL supabase/migrations tree. That is the
      # part that rots: a migration written in a shape the parser does not read
      # would drop out of the expected state silently, and the probe would report
      # a database as in sync precisely about the file nobody checked.
      - name: migration-presence (parser selftest against the real migrations tree)
        run: node scripts/db-tests/migration-presence/probe.mjs --selftest

  # Phase-7 Gate 0 MANDATORY real-token evidence: run the provider countTokens on
  # the EXACT maximum-legal Director envelope and FAIL CLOSED if GEMINI_API_KEY is
  # not configured. The conservative bound (tokens <= bytes) is proven in the
  # unit tests + the --selftest step; this job records the ACTUAL provider count.
  director-token-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Real Gemini countTokens on the max 30-minute envelope (mandatory, fail-closed)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/director-eval/count_tokens.mjs

  # ── `staging-matrix-required` LIVED HERE AND HAS MOVED ────────────────────
  # It is now .github/workflows/staging-matrix-gate.yml, reporting the commit
  # status `staging-matrix-gate`, and it is NOT the same trigger.
  #
  # WHAT IT DID, AND WHY IT IS NOT COMING BACK IN THIS FILE. `staging-integration`
  # runs the REAL Phase 1-7 matrix (live Gemini call, real ASR, real ffprobe,
  # migrations applied to the staging database) but only triggers on push to
  # `rebuild/editor-v2-*` or manual dispatch. A head that lands via any other
  # branch could therefore merge having proven nothing beyond typechecks. That
  # is not hypothetical: #200 merged on `a2cd85f` with PR checks only, carrying
  # a Phase-6 assertion (D1, the oversized-script guard) that had silently
  # stopped testing anything. The matrix would have caught it; the matrix was
  # never run on that head. So the gate stays, and it is still the merge
  # requirement — it just cannot live on `pull_request`.
  #
  # THE REASON IT CANNOT. This job ran at PUSH time and demanded a SUCCESSFUL
  # matrix run at the exact head. The matrix takes ~77 minutes. There is no
  # value of any timeout that fixes that: the check could only fail an hour
  # early or hold a billable runner for the hour and then usually fail anyway.
  # It failed early, so every push produced a red X meaning "not yet" and a
  # human had to re-run it later. A `check run` has no `pending` conclusion to
  # express "not answered yet"; a `commit status` does, which is why the
  # replacement reports a status and is triggered by the matrix COMPLETING.
  #
  # The green condition is unchanged: a `staging-integration` run with
  # conclusion `success` at the exact head being merged.
  #
  # BRANCH PROTECTION MUST BE UPDATED WHEN THIS MERGES — remove the required
  # check `staging-matrix-required`, add the required status
  # `staging-matrix-gate`. A required check that no longer reports leaves every
  # PR blocked on "Expected — waiting for status to be reported".
