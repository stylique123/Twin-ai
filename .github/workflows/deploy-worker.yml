# Deploys the TwinAI worker to the VPS (where it actually runs as the
# `twinai-worker` Docker container). GitHub `main` is the single source of truth:
# on every push that touches worker/, this SSHes to the VPS, pulls the repo,
# rebuilds the image, and recreates the container with the existing env file.
#
# One-time setup — repo Settings → Secrets and variables → Actions (BOTH
# secrets are REQUIRED; this workflow fails closed without either):
#   VPS_SSH_KEY      — a private SSH key whose PUBLIC key is in the VPS's
#                      /root/.ssh/authorized_keys (a dedicated deploy key).
#   VPS_KNOWN_HOSTS  — the VPS's pinned SSH host key line, for STRICT host
#                      verification (StrictHostKeyChecking=yes). Without it the
#                      deploy refuses to SSH (MITM protection). Get it via
#                      DEPLOY.md → "Pinning the VPS host key".
# (Container env lives on the box; these two secrets are all that's needed here.)

name: Deploy worker
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/deploy-worker.yml']

concurrency:
  group: deploy-worker
  cancel-in-progress: false

env:
  VPS_HOST: 138.201.119.239

jobs:
  # Gate: never ship a worker that doesn't compile (main has no other guard —
  # pr-checks runs on PRs, but a direct push to main would skip it).
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Typecheck worker
        working-directory: worker
        run: |
          npm ci
          npx tsc --noEmit

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS over SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          if [ -z "$VPS_SSH_KEY" ]; then
            echo "::error::VPS_SSH_KEY secret is not set — add it in repo Settings → Secrets → Actions."
            exit 1
          fi
          # Pinned host key, strict verification, fail-closed (no ssh-keyscan /
          # StrictHostKeyChecking=no — those trust a possibly-spoofed host). The
          # host key comes from the protected VPS_KNOWN_HOSTS secret. Never printed.
          if [ -z "$VPS_KNOWN_HOSTS" ]; then
            echo "::error::VPS_KNOWN_HOSTS secret is not set — refusing to SSH without a pinned host key (MITM risk). See DEPLOY.md → 'Pinning the VPS host key'."
            exit 1
          fi
          mkdir -p ~/.ssh; chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts_vps"
          chmod 600 "$HOME/.ssh/known_hosts_vps"
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts_vps" root@"$VPS_HOST" 'bash -se' <<'REMOTE'
            set -euo pipefail
            cd /opt/twinai-worker-src
            # Reset to the JUST-FETCHED main (FETCH_HEAD), not the remote-tracking
            # ref origin/main — the repo's fetch refspec doesn't update origin/main,
            # so `reset --hard origin/main` could land on a stale commit.
            git fetch origin main
            git reset --hard FETCH_HEAD
            # Old-editor cleanup: drop Revideo wiring from the box env, remove the
            # Revideo container + image, and drop the retired job types (autoedit,
            # transcribe) from the box's WORKER_JOB_TYPES override so the box config
            # matches the canonical code registry in worker/src/env.ts:
            # {ingest, build_voice, scrape_dna, validate_source, editor_v2}.
            # transcribe was retired (ingest-reference enqueues 'ingest'); autoedit
            # was removed with the old editor. Neither has a handler, so a stale
            # override would only make the worker claim jobs it can't run.
            # REVIDEO[-_], not REVIDEO_: a real box carried `REVIDEO-TRUSTED=true`
            # with a hyphen, which this scrub never matched, so it survived every
            # deploy. A hyphen is illegal in a shell variable name, so sourcing the
            # env file aborts on that line and anything chained after it never runs.
            # Kept identical to deploy-vps.sh — the two paths must not drift.
            sed -i '/^REVIDEO[-_]/d;/^PEXELS_API_KEY/d;/^MUSIC_BED_URL/d;/^EDIT_/d' /opt/twinai-worker.env || true
            # Drop the box's WORKER_JOB_TYPES override entirely: the code default in
            # worker/src/env.ts is the single source of truth for job types now.
            # (A stale override once kept retired types alive AND would silently
            # exclude newly-registered types like validate_source.)
            sed -i '/^WORKER_JOB_TYPES=/d' /opt/twinai-worker.env || true
            echo "worker job types: code default (see worker/src/env.ts jobTypes)"
            docker rm -f twinai-revideo 2>/dev/null || true
            docker rmi -f twinai-revideo 2>/dev/null || true
            echo "revideo container: $(docker ps -a --filter name=twinai-revideo -q | grep -q . && echo STILL-PRESENT || echo removed)"
            echo "port 4500 listener: $(ss -tlnp 2>/dev/null | grep -q ':4500 ' && echo STILL-LISTENING || echo none)"
            # Keep the last-good image so a boot-crashing build can roll back
            # instead of leaving NOTHING running (the old rm-then-run had no net).
            docker tag twinai-worker twinai-worker:prev 2>/dev/null || true
            # Inject the EXACT deployed commit as build provenance. The boot
            # manifest requires a 40-hex WORKER_GIT_SHA (editor_pin_manifest
            # rejects a hollow manifest), so a build without it fails closed.
            DEPLOY_SHA="$(git rev-parse HEAD)"
            docker build --build-arg WORKER_GIT_SHA="$DEPLOY_SHA" -t twinai-worker worker/
            docker rm -f twinai-worker 2>/dev/null || true
            docker run -d --name twinai-worker --restart unless-stopped \
              --env-file /opt/twinai-worker.env twinai-worker
            sleep 8
            # ⚠️ ANCHORED. `--filter name=twinai-worker` is a SUBSTRING match, so
            # this guard could be satisfied by a DIFFERENT container whose name
            # merely contains the string — including a stale one. A rollback
            # check that can pass on the wrong container is worse than none: it
            # reports a healthy deploy while the new image lies dead.
            if ! docker ps --filter name='^twinai-worker$' --filter status=running -q | grep -q .; then
              echo "::error::new worker image crashed on boot — rolling back to previous image"
              docker logs --tail 30 twinai-worker || true
              docker rm -f twinai-worker 2>/dev/null || true
              docker run -d --name twinai-worker --restart unless-stopped \
                --env-file /opt/twinai-worker.env twinai-worker:prev
              exit 1
            fi
            docker image prune -f >/dev/null 2>&1 || true
            # ⚠️ AND THE BUILD CACHE, WHICH IS THE BIGGER HALF AND WAS NOT SWEPT.
            #
            # MEASURED ON THE VPS, 2026-09-04: `docker system df` reported
            # Images 82.42GB (17.83GB reclaimable) and BUILD CACHE 94.68GB with
            # 86.2GB reclaimable across 1,451 entries — ZERO of them active. The
            # disk was at 85% of 150GB with 23GB left. Pruning the cache by hand
            # took it to 29% and returned 104GB.
            #
            # ⚖️ THE LINE ABOVE WAS ALREADY DOING HALF THIS JOB. `docker image
            # prune` sweeps dangling IMAGES, and someone clearly thought about
            # housekeeping when they wrote it — but BuildKit's layer cache is a
            # separate store that `image prune` never touches, and it is where
            # five sixths of the space actually went. Half a sweep looks like a
            # whole one right up until the disk fills.
            #
            # ⚠️ A FULL DISK DOES NOT ANNOUNCE ITSELF AS A FULL DISK. The worker
            # would fail to write, and the errors surface as scan and job
            # failures with unrelated-looking messages — the expensive kind of
            # outage, diagnosed from the wrong end.
            #
            # ⚖️ AN AGE FILTER, NOT `--keep-storage`, AND THE REASON IS PORTABILITY.
            # `--keep-storage` caps by SIZE, which reads like the better fit —
            # but it is deprecated in current Docker in favour of
            # `--reserved-space`, so the flag this box accepts depends on a
            # version nobody here pins. `--filter until=` has been stable across
            # every version in between. At the measured growth rate (94GB over
            # ~5 weeks, ~19GB/week) a 7-day window caps the cache near 20GB,
            # which is the same outcome by a route that cannot go stale.
            #
            # ⚖️ AND IT KEEPS THE WEEK THAT MATTERS. Layers touched in the last
            # 7 days are the ones an incremental build actually reuses, so
            # deploys stay fast; older entries are the dead weight — all 1,451
            # of the entries measured above were inactive.
            #
            # ⚠️ NOT SILENCED, AND THAT IS DELIBERATE. Written as
            # `>/dev/null 2>&1 || true` this would fail OPEN AND INVISIBLY: a
            # rejected flag, a BuildKit that is not running, any error at all,
            # and the sweep simply never happens while the log looks exactly
            # like success. That is the failure this repo keeps finding —
            # absence of an error is not evidence a check ran. So the output is
            # printed: the deploy log now says how much was reclaimed, and a
            # sweep that stops working says so instead of disappearing.
            #
            # ⚖️ IT STILL DOES NOT FAIL THE DEPLOY. Reclaiming disk is not worth
            # failing a deploy that has already booted a healthy worker, so the
            # `|| true` stays — what changes is that the failure is visible.
            echo "-- build cache sweep (older than 7 days) --"
            docker builder prune -f --filter until=168h || echo "::warning::build-cache sweep failed — disk will grow until this is fixed"

            # ⚠️ ONE WORKER, OR THIS DEPLOY IS A LIE.
            #
            # MEASURED 2026-09-03, in this workflow's own log: the final
            # `docker ps` printed TWO lines —
            #     STATUS: Up 8 seconds (healthy)
            #     STATUS: Up 25 hours (healthy)
            # A second container whose name contains `twinai-worker` had been
            # running for a DAY, claiming from the same queue on a day-old
            # build. `docker rm -f twinai-worker` removes only the exact name,
            # so nothing here ever replaced or even noticed it.
            #
            # The cost is not theoretical. Whether a merged change took effect
            # became a coin flip decided by which container claimed the job,
            # and every green deploy said the change was live. Tier 0 columns
            # written by one build and not the other read as an intermittent
            # application bug for hours.
            #
            # So: fail the deploy. A stale sibling is not a warning, because a
            # warning in a log nobody reads is how this survived 25 hours.
            OTHERS="$(docker ps --filter name=twinai-worker --format '{{.Names}}' \
                      | grep -vx 'twinai-worker' || true)"
            if [ -n "$OTHERS" ]; then
              echo "::error::a second worker container is claiming the same queue: $OTHERS"
              echo "::error::remove it (docker rm -f $OTHERS) — until then, which build handles a job is a coin flip"
              docker ps --filter name=twinai-worker --format 'LEFTOVER: {{.Names}} | {{.Status}} | {{.Image}}'
              exit 1
            fi

            echo "deployed: $(git rev-parse --short HEAD)"
            docker logs --tail 3 twinai-worker
            docker ps --filter name='^twinai-worker$' --format 'STATUS: {{.Status}}'
          REMOTE
