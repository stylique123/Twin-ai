name: VPS diagnostic (read-only, fail-closed sign-off)
# NO workflow_dispatch inputs on purpose: the expected deployed SHA must derive
# ONLY from origin/main. A caller-supplied expected_sha could pin a stale
# deployed commit and make drift pass, which would defeat the whole fail-closed
# authority. (scripts/ci/check_vps_diag_authority.mjs enforces this in CI.)
on: { workflow_dispatch: {} }
env:
  VPS_HOST: 138.201.119.239
  # The canonical five-type registry (worker/src/env.ts). The single-deploy CI
  # guard already enforces env.ts == this set; here we assert the RUNNING worker
  # matches it too.
  EXP_REGISTRY: 'ingest,build_voice,scrape_dna,validate_source,editor_v2'
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Expected values are derived from the repo (never hand-typed or caller
      # supplied): deployed SHA == origin/main head (validated 40-hex, fail
      # closed); the pinned model identity is the committed manifest; the load
      # path is the committed Dockerfile ENV. Self-updating and drift-proof.
      - name: Resolve expected SHA + model identity (from origin/main + committed manifest)
        run: |
          set -euo pipefail
          M=worker/models/faster-whisper-small.manifest.json
          EXP_SHA=$(git ls-remote origin main | head -1 | cut -f1)
          printf '%s' "$EXP_SHA" | grep -Eq '^[0-9a-f]{40}$' \
            || { echo "::error::origin/main SHA is not 40 hex chars: '$EXP_SHA'"; exit 1; }
          EXP_REPOSITORY=$(jq -r .repository "$M")
          EXP_REVISION=$(jq -r .revision "$M")
          EXP_BUNDLE=$(jq -r .analyzerBundle "$M")
          EXP_MANIFEST_SHA=$(sha256sum "$M" | cut -d' ' -f1)
          EXP_MODEL_PATH=$(grep -oE 'EDITOR_SPEECH_MODEL_PATH=[^[:space:]]+' worker/Dockerfile | head -1 | cut -d= -f2)
          for v in EXP_REPOSITORY EXP_REVISION EXP_BUNDLE EXP_MODEL_PATH; do
            val="${!v}"; [ -n "$val" ] && [ "$val" != "null" ] || { echo "::error::$v empty"; exit 1; }
          done
          printf '%s' "$EXP_MANIFEST_SHA" | grep -Eq '^[0-9a-f]{64}$' || { echo "::error::EXP_MANIFEST_SHA not sha256"; exit 1; }
          {
            echo "EXP_SHA=$EXP_SHA"
            echo "EXP_REPOSITORY=$EXP_REPOSITORY"
            echo "EXP_REVISION=$EXP_REVISION"
            echo "EXP_BUNDLE=$EXP_BUNDLE"
            echo "EXP_MANIFEST_SHA=$EXP_MANIFEST_SHA"
            echo "EXP_MODEL_PATH=$EXP_MODEL_PATH"
          } >> "$GITHUB_ENV"
          echo "expected: sha=$EXP_SHA repo=$EXP_REPOSITORY revision=$EXP_REVISION bundle=$EXP_BUNDLE path=$EXP_MODEL_PATH manifestSha=${EXP_MANIFEST_SHA:0:12}…"

      # READ-ONLY capture over SSH with a PINNED host key (strict verification,
      # fail-closed). No ssh-keyscan / StrictHostKeyChecking=no — those trust
      # whatever host answers on first contact, so a MITM could spoof the VPS
      # facts. The host key comes from the protected VPS_KNOWN_HOSTS secret and
      # SSH must match it (StrictHostKeyChecking=yes). Neither key is printed.
      # Captures are DEFENSIVE (|| true) so the block always emits a COMPLETE
      # OBS_* set; the fail-closed DECISION is made afterwards by
      # worker/scripts/vps_signoff_assert.sh, never by an echo fallback here.
      - name: Capture VPS facts (pinned host key)
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "${VPS_SSH_KEY:-}" ]; then echo "::error::VPS_SSH_KEY secret not set"; exit 1; fi
          if [ -z "${VPS_KNOWN_HOSTS:-}" ]; then
            echo "::error::VPS_KNOWN_HOSTS secret not set — refusing to SSH without a pinned host key (MITM risk). See DEPLOY.md → 'Pinning the VPS host key'."
            exit 1
          fi
          mkdir -p ~/.ssh; chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519; chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts_vps"; chmod 600 "$HOME/.ssh/known_hosts_vps"
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts_vps" \
            root@"$VPS_HOST" bash -s > facts.env <<'DIAG'
          set -uo pipefail
          C=twinai-worker
          emit() { printf '%s=%q\n' "$1" "${2:-}"; }

          echo "== raw containers ==" >&2
          docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' >&2 || true

          sha=$(git -C /opt/twinai-worker-src rev-parse HEAD 2>/dev/null || true)
          status=$(docker inspect "$C" --format '{{.State.Status}}' 2>/dev/null || true)
          health=$(docker inspect "$C" --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' 2>/dev/null || true)
          restarts=$(docker inspect "$C" --format '{{.RestartCount}}' 2>/dev/null || true)

          upline=$(docker logs "$C" 2>&1 | grep '"msg":"worker up"' | tail -1 || true)
          registry=$(printf '%s' "$upline" | sed -n 's/.*"types":\[\([^]]*\)\].*/\1/p' | tr -d '"' | tr ',' '\n' | sed '/^[[:space:]]*$/d' | sort | paste -sd, - || true)
          override=$(docker exec "$C" printenv WORKER_JOB_TYPES 2>/dev/null || true)

          mident=$(docker exec "$C" python3 -c "import json;m=json.load(open('models/faster-whisper-small.manifest.json'));print(m['repository']+'|'+m['revision']+'|'+m['analyzerBundle'])" 2>/dev/null || true)
          repository=$(printf '%s' "$mident" | cut -d'|' -f1)
          revision=$(printf '%s' "$mident" | cut -d'|' -f2)
          bundle=$(printf '%s' "$mident" | cut -d'|' -f3)
          manifest_sha=$(docker exec "$C" python3 -c "import hashlib;print(hashlib.sha256(open('models/faster-whisper-small.manifest.json','rb').read()).hexdigest())" 2>/dev/null || true)
          model_path=$(docker exec "$C" printenv EDITOR_SPEECH_MODEL_PATH 2>/dev/null || true)
          docker exec "$C" python3 scripts/fetch_model.py --verify-only --manifest models/faster-whisper-small.manifest.json --dest "${model_path:-/opt/models/faster-whisper-small}" >/dev/null 2>&1 && vrc=0 || vrc=$?
          test_allow=$(docker exec "$C" printenv EDITOR_ALLOW_TEST_MODEL_MANIFEST 2>/dev/null || true)
          test_manifest=$(docker exec "$C" printenv EDITOR_SPEECH_MODEL_MANIFEST 2>/dev/null || true)

          rv1=$(docker ps -a --format '{{.Names}} {{.Image}}' | grep -ci revideo || true)
          rv2=$(docker images --format '{{.Repository}}' | grep -ci revideo || true)
          rv3=$(docker network ls --format '{{.Name}}' | grep -ci revideo || true)
          revideo=$((rv1 + rv2 + rv3))
          port4500=$({ ss -ltnH 2>/dev/null || netstat -ltn 2>/dev/null; } | grep -cE '[:.]4500([^0-9]|$)' || true)
          le1=$(docker exec "$C" printenv 2>/dev/null | grep -ciE '^(REVIDEO_|EDIT_|PEXELS_API_KEY|MUSIC_BED_URL)' || true)
          le2=$(grep -ciE '^(REVIDEO_|EDIT_|PEXELS_API_KEY|MUSIC_BED_URL)' /opt/twinai-worker.env 2>/dev/null || true)
          legacy_env=$((le1 + le2))

          {
            echo "OBS snapshot: sha=$sha status=$status health=$health restarts=$restarts"
            echo "  repo=$repository revision=$revision bundle=$bundle path=$model_path manifestSha=${manifest_sha:0:12} verify_rc=$vrc"
            echo "  registry=[$registry] override=[$override] test_allow=[$test_allow] test_manifest=[$test_manifest] revideo=$revideo port4500=$port4500 legacy_env=$legacy_env"
          } >&2

          # ---- Phase 8 Gate-0 capacity inventory (READ-ONLY) --------------------
          # Rendering re-encodes frames; analysis only reads them. The Phase-6 analysis
          # figures (0.58x realtime, 92 MiB RSS) do NOT predict encode cost, so Phase 8
          # needs the real hardware envelope before its capacity thresholds mean anything.
          # Every command below inspects; none mutates. No new SSH path, no new secret.
          cpu_count=$(nproc 2>/dev/null || true)
          cpu_model=$(awk -F': ' '/^model name/{print $2; exit}' /proc/cpuinfo 2>/dev/null | tr -s ' ' || true)
          mem_total_kb=$(awk '/^MemTotal:/{print $2}' /proc/meminfo 2>/dev/null || true)
          mem_avail_kb=$(awk '/^MemAvailable:/{print $2}' /proc/meminfo 2>/dev/null || true)
          swap_total_kb=$(awk '/^SwapTotal:/{print $2}' /proc/meminfo 2>/dev/null || true)
          swap_free_kb=$(awk '/^SwapFree:/{print $2}' /proc/meminfo 2>/dev/null || true)
          # Root filesystem and the Docker data root — the render temp dir lives under
          # the container, so Docker's filesystem is the one that actually constrains a render.
          fs_root_avail_kb=$(df -Pk / 2>/dev/null | awk 'NR==2{print $4}' || true)
          fs_root_pct=$(df -Pk / 2>/dev/null | awk 'NR==2{print $5}' | tr -d '%' || true)
          docker_root=$(docker info --format '{{.DockerRootDir}}' 2>/dev/null || true)
          fs_docker_avail_kb=$(df -Pk "${docker_root:-/var/lib/docker}" 2>/dev/null | awk 'NR==2{print $4}' || true)
          # In-container free space at the worker's temp root: what a render can actually use.
          ctr_tmp_avail_kb=$(docker exec "$C" df -Pk /tmp 2>/dev/null | awk 'NR==2{print $4}' || true)
          image_id=$(docker inspect "$C" --format '{{.Image}}' 2>/dev/null || true)
          image_ref=$(docker inspect "$C" --format '{{.Config.Image}}' 2>/dev/null || true)
          image_digest=$(docker inspect "$C" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' 2>/dev/null || true)
          created=$(docker inspect "$C" --format '{{.Created}}' 2>/dev/null || true)
          started=$(docker inspect "$C" --format '{{.State.StartedAt}}' 2>/dev/null || true)
          uptime_s=$(awk '{print int($1)}' /proc/uptime 2>/dev/null || true)
          loadavg=$(awk '{print $1"|"$2"|"$3}' /proc/loadavg 2>/dev/null || true)
          # NOT a measure of active work. This counts "claimed" lines in the last 400 log
          # lines — a historical record of claims that includes long-finished jobs. Actual
          # active/running jobs and live leases come from the DATABASE, queried separately
          # with before/after timestamps. Reporting log lines as active work would be a lie.
          claims=$(docker logs --tail 400 "$C" 2>&1 | grep -c '"msg":"claimed"' || true)
          ffmpeg_ver=$(docker exec "$C" ffmpeg -hide_banner -version 2>/dev/null | head -1 || true)
          ffprobe_ok=$(docker exec "$C" ffprobe -hide_banner -version >/dev/null 2>&1 && echo 1 || echo 0)
          # Other containers on the box — #203 asks whether anything is restart-looping.
          other_restarts=$(docker ps -a --format '{{.Names}}' 2>/dev/null | while read -r n; do
            [ "$n" = "$C" ] && continue
            r=$(docker inspect "$n" --format '{{.RestartCount}}' 2>/dev/null || echo 0)
            printf '%s:%s ' "$n" "$r"
          done || true)

          emit OBS_CPU_COUNT "$cpu_count"
          emit OBS_CPU_MODEL "$cpu_model"
          emit OBS_MEM_TOTAL_KB "$mem_total_kb"
          emit OBS_MEM_AVAIL_KB "$mem_avail_kb"
          emit OBS_SWAP_TOTAL_KB "$swap_total_kb"
          emit OBS_SWAP_FREE_KB "$swap_free_kb"
          emit OBS_FS_ROOT_AVAIL_KB "$fs_root_avail_kb"
          emit OBS_FS_ROOT_USED_PCT "$fs_root_pct"
          emit OBS_FS_DOCKER_AVAIL_KB "$fs_docker_avail_kb"
          emit OBS_CTR_TMP_AVAIL_KB "$ctr_tmp_avail_kb"
          emit OBS_IMAGE_ID "$image_id"
          emit OBS_IMAGE_REF "$image_ref"
          emit OBS_IMAGE_REVISION "$image_digest"
          emit OBS_CREATED "$created"
          emit OBS_STARTED "$started"
          emit OBS_UPTIME_S "$uptime_s"
          emit OBS_LOADAVG "$loadavg"
          emit OBS_RECENT_CLAIM_LOG_LINES "$claims"
          emit OBS_FFMPEG_VERSION "$ffmpeg_ver"
          emit OBS_FFPROBE_OK "$ffprobe_ok"
          # ---- stylique-os crash-loop diagnosis (READ-ONLY) ----------------------
          # The 2026-07-27 inventory recorded stylique-os at 23028 restarts while every
          # other container sat at 0. That is a hard crash loop on the box that will run
          # Phase 8 renders, so it needs a cause, not just a count.
          #
          # STRICTLY READ-ONLY: inspect + logs + ps only. This never restarts, stops,
          # kills, removes or edits the container. A crash-looping container is still
          # evidence; destroying its state would destroy the diagnosis.
          SO=stylique-os
          so_exists=$(docker ps -a --format '{{.Names}}' 2>/dev/null | grep -cx "$SO" || true)
          if [ "${so_exists:-0}" -ge 1 ]; then
            so_image=$(docker inspect "$SO" --format '{{.Config.Image}}' 2>/dev/null || true)
            so_imageid=$(docker inspect "$SO" --format '{{.Image}}' 2>/dev/null || true)
            so_state=$(docker inspect "$SO" --format '{{.State.Status}}' 2>/dev/null || true)
            so_exit=$(docker inspect "$SO" --format '{{.State.ExitCode}}' 2>/dev/null || true)
            so_oom=$(docker inspect "$SO" --format '{{.State.OOMKilled}}' 2>/dev/null || true)
            so_err=$(docker inspect "$SO" --format '{{.State.Error}}' 2>/dev/null || true)
            so_restarts=$(docker inspect "$SO" --format '{{.RestartCount}}' 2>/dev/null || true)
            so_policy=$(docker inspect "$SO" --format '{{.HostConfig.RestartPolicy.Name}}:{{.HostConfig.RestartPolicy.MaximumRetryCount}}' 2>/dev/null || true)
            so_started=$(docker inspect "$SO" --format '{{.State.StartedAt}}' 2>/dev/null || true)
            so_finished=$(docker inspect "$SO" --format '{{.State.FinishedAt}}' 2>/dev/null || true)
            so_memlimit=$(docker inspect "$SO" --format '{{.HostConfig.Memory}}' 2>/dev/null || true)
            so_health=$(docker inspect "$SO" --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' 2>/dev/null || true)
            # Tail only. Redact anything shaped like a credential BEFORE it leaves the host:
            # key=value secrets, bearer tokens, JWTs, and any URL carrying userinfo.
            so_logs=$(docker logs --tail 60 "$SO" 2>&1 \
              | sed -E 's/(password|passwd|secret|token|api[_-]?key|apikey|authorization)[=:][^[:space:]"]*/\1=[REDACTED]/gI' \
              | sed -E 's/(Bearer|Basic)[[:space:]]+[A-Za-z0-9._~+\/-]+=*/\1 [REDACTED]/g' \
              | sed -E 's/eyJ[A-Za-z0-9._-]{20,}/[REDACTED_JWT]/g' \
              | sed -E 's#([a-z][a-z0-9+.-]*://)[^/[:space:]@]+@#\1[REDACTED]@#g' \
              | tail -c 6000 || true)
          else
            so_state=absent
          fi
          emit OBS_SO_EXISTS "$so_exists"
          emit OBS_SO_IMAGE "${so_image:-}"
          emit OBS_SO_IMAGE_ID "${so_imageid:-}"
          emit OBS_SO_STATE "${so_state:-}"
          emit OBS_SO_EXIT_CODE "${so_exit:-}"
          emit OBS_SO_OOMKILLED "${so_oom:-}"
          emit OBS_SO_ERROR "${so_err:-}"
          emit OBS_SO_RESTARTS "${so_restarts:-}"
          emit OBS_SO_RESTART_POLICY "${so_policy:-}"
          emit OBS_SO_STARTED "${so_started:-}"
          emit OBS_SO_FINISHED "${so_finished:-}"
          emit OBS_SO_MEM_LIMIT "${so_memlimit:-}"
          emit OBS_SO_HEALTH "${so_health:-}"
          emit OBS_SO_LOGS "${so_logs:-}"

          emit OBS_OTHER_RESTARTS "$other_restarts"

          emit OBS_SHA "$sha"
          emit OBS_STATUS "$status"
          emit OBS_HEALTH "$health"
          emit OBS_RESTARTS "$restarts"
          emit OBS_REGISTRY "$registry"
          emit OBS_JOBTYPES_OVERRIDE "$override"
          emit OBS_REPOSITORY "$repository"
          emit OBS_REVISION "$revision"
          emit OBS_BUNDLE "$bundle"
          emit OBS_MANIFEST_SHA "$manifest_sha"
          emit OBS_MODEL_PATH "$model_path"
          emit OBS_VERIFY_RC "$vrc"
          emit OBS_TEST_ALLOW "$test_allow"
          emit OBS_TEST_MANIFEST "$test_manifest"
          emit OBS_REVIDEO "$revideo"
          emit OBS_PORT4500 "$port4500"
          emit OBS_LEGACY_ENV "$legacy_env"
          DIAG
          echo "---- captured facts.env ----"
          cat facts.env

      # Phase 8 Gate-0 capacity inventory report. Runs BEFORE the sign-off assert so
      # the inventory is captured even when the assert fails on drift (which is exactly
      # what happened on 2026-07-26: SHA drift failed the run and the facts were only
      # visible by reading raw logs). Informational by design — it never fails the run,
      # because a capacity fact is evidence, not a gate.
      # Host-key pinning must be PROVEN, not asserted. Reaching this step means the
      # StrictHostKeyChecking=yes session above returned 0 under `set -e`, i.e. the pinned
      # key verified. We record that fact plus a SHA-256 of the pinned known_hosts entry —
      # an identity commitment, not the material (a host public key is not secret, but we
      # publish only its digest so the report never carries key bytes).
      - name: Record host-key verification proof
        run: |
          set -euo pipefail
          KH="$HOME/.ssh/known_hosts_vps"
          [ -s "$KH" ] || { echo "::error::pinned known_hosts missing after a successful SSH — refusing to claim pinning"; exit 1; }
          {
            echo "OBS_KNOWN_HOSTS_SHA256=$(sha256sum "$KH" | cut -d' ' -f1)"
            echo "OBS_SSH_STRICT_VERIFIED=1"
          } >> facts.env

      - name: Phase 8 capacity inventory (informational, hashed report)
        if: always()
        run: |
          set -euo pipefail
          set -a; . ./facts.env; set +a
          kb2g() { awk -v k="${1:-0}" 'BEGIN{ if (k=="") k=0; printf "%.2f", k/1048576 }'; }
          python3 - <<'PYEOF' > vps-inventory.json
          import json, os, hashlib
          def g(k, d=''): return os.environ.get(k, d)
          def parse_restarts(raw):
              # wire format is 'name:count name:count '. Emitted structured so every
              # count can be validated instead of eyeballed in a blob of text.
              out = []
              for tok in (raw or '').split():
                  if ':' not in tok: continue
                  n, _, c = tok.rpartition(':')
                  try: out.append({'name': n, 'restarts': int(c)})
                  except ValueError: out.append({'name': n, 'restarts': None})
              return sorted(out, key=lambda e: e['name'])
          def kb(k):
              v = g(k, '')
              try: return int(v)
              except Exception: return None
          # NOTE: only non-secret facts are emitted. No env dumps, no keys, no tokens,
          # no signed URLs. Image *identity* only, never registry credentials.
          inv = {
            'schema': 'vps-inventory-1',
            'ssh': {'strict_host_key_verified': g('OBS_SSH_STRICT_VERIFIED') == '1',
                    'known_hosts_sha256': g('OBS_KNOWN_HOSTS_SHA256')},
            'cpu':   {'count': kb('OBS_CPU_COUNT'), 'model': g('OBS_CPU_MODEL')},
            'memory':{'total_kb': kb('OBS_MEM_TOTAL_KB'), 'available_kb': kb('OBS_MEM_AVAIL_KB')},
            'swap':  {'total_kb': kb('OBS_SWAP_TOTAL_KB'), 'free_kb': kb('OBS_SWAP_FREE_KB')},
            'disk':  {'root_avail_kb': kb('OBS_FS_ROOT_AVAIL_KB'),
                      'root_used_pct': kb('OBS_FS_ROOT_USED_PCT'),
                      'docker_avail_kb': kb('OBS_FS_DOCKER_AVAIL_KB'),
                      'container_tmp_avail_kb': kb('OBS_CTR_TMP_AVAIL_KB')},
            'container': {'status': g('OBS_STATUS'), 'health': g('OBS_HEALTH'),
                          'restarts': kb('OBS_RESTARTS'), 'created': g('OBS_CREATED'),
                          'started': g('OBS_STARTED'),
                          'image_id': g('OBS_IMAGE_ID'), 'image_ref': g('OBS_IMAGE_REF'),
                          'image_revision': g('OBS_IMAGE_REVISION')},
            'worker': {'deployed_sha': g('OBS_SHA'), 'registry': g('OBS_REGISTRY').replace('\\',''),
                       'recent_claim_log_lines': kb('OBS_RECENT_CLAIM_LOG_LINES')},
            'media':  {'ffmpeg_version': g('OBS_FFMPEG_VERSION'), 'ffprobe_ok': g('OBS_FFPROBE_OK')},
            'host':   {'uptime_s': kb('OBS_UPTIME_S'), 'loadavg': g('OBS_LOADAVG'),
                       'other_container_restarts': parse_restarts(g('OBS_OTHER_RESTARTS'))},
          }
          # ensure_ascii=False is REQUIRED for cross-runtime parity: Python escapes
          # non-ASCII by default (\u00ae) while JS JSON.stringify emits the raw
          # character, so a CPU model containing (R) would hash differently in the
          # validator and be rejected as 'substituted'. Verified by a parity test.
          body = json.dumps(inv, sort_keys=True, separators=(',', ':'), ensure_ascii=False)
          inv['report_sha256'] = hashlib.sha256(body.encode()).hexdigest()
          print(json.dumps(inv, sort_keys=True, indent=2, ensure_ascii=False))
          PYEOF
          echo "===== PHASE 8 CAPACITY INVENTORY ====="
          cat vps-inventory.json
          echo "====================================="
          echo "CPU      : ${OBS_CPU_COUNT:-?} x ${OBS_CPU_MODEL:-?}"
          echo "RAM      : $(kb2g "${OBS_MEM_TOTAL_KB:-0}") GiB total / $(kb2g "${OBS_MEM_AVAIL_KB:-0}") GiB available"
          echo "Swap     : $(kb2g "${OBS_SWAP_TOTAL_KB:-0}") GiB total / $(kb2g "${OBS_SWAP_FREE_KB:-0}") GiB free"
          echo "Disk     : root $(kb2g "${OBS_FS_ROOT_AVAIL_KB:-0}") GiB free (${OBS_FS_ROOT_USED_PCT:-?}% used) | docker $(kb2g "${OBS_FS_DOCKER_AVAIL_KB:-0}") GiB | ctr /tmp $(kb2g "${OBS_CTR_TMP_AVAIL_KB:-0}") GiB"
          echo "Load     : ${OBS_LOADAVG:-?}  uptime ${OBS_UPTIME_S:-?}s"
          echo "ClaimLog : ${OBS_RECENT_CLAIM_LOG_LINES:-?} 'claimed' lines in last 400 (NOT active work)"
          echo "Other ctr: ${OBS_OTHER_RESTARTS:-none}"

      # Read-only crash-loop diagnosis, printed separately from the capacity inventory
      # so it survives a failing sign-off assert and is not mixed into the hashed report.
      - name: stylique-os crash-loop diagnosis (read-only)
        if: always()
        run: |
          set -euo pipefail
          set -a; . ./facts.env; set +a
          echo "===== stylique-os DIAGNOSIS (read-only; container untouched) ====="
          if [ "${OBS_SO_EXISTS:-0}" = "0" ]; then
            echo "container not present on this host"; exit 0
          fi
          echo "image          : ${OBS_SO_IMAGE:-?}"
          echo "image id       : ${OBS_SO_IMAGE_ID:-?}"
          echo "state          : ${OBS_SO_STATE:-?}   health: ${OBS_SO_HEALTH:-?}"
          echo "exit code      : ${OBS_SO_EXIT_CODE:-?}"
          echo "OOMKilled      : ${OBS_SO_OOMKILLED:-?}"
          echo "state error    : ${OBS_SO_ERROR:-<none>}"
          echo "restart count  : ${OBS_SO_RESTARTS:-?}"
          echo "restart policy : ${OBS_SO_RESTART_POLICY:-?}"
          echo "memory limit   : ${OBS_SO_MEM_LIMIT:-0} bytes (0 = unlimited)"
          echo "started / finished: ${OBS_SO_STARTED:-?}  /  ${OBS_SO_FINISHED:-?}"
          echo
          echo "----- last 60 log lines (credentials redacted on the host) -----"
          printf '%s\n' "${OBS_SO_LOGS:-<no logs>}"
          echo "----- end -----"

      - name: Upload inventory report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vps-inventory
          path: vps-inventory.json
          if-no-files-found: error

      # GATE-0 ACCEPTANCE. The report stays informational for the sign-off, but a Gate-0
      # row cannot be closed on an inventory with missing, null, out-of-range or
      # SUBSTITUTED facts. This validates required fields and ranges, and recomputes
      # report_sha256 over the body. Runs AFTER upload so the artifact survives a
      # rejection — you can inspect exactly what failed.
      - name: Validate inventory (fail closed)
        if: always()
        run: node scripts/ci/validate_vps_inventory.mjs vps-inventory.json

      - name: Assert sign-off snapshot (fail-closed)
        run: |
          set -euo pipefail
          set -a; . ./facts.env; set +a
          bash worker/scripts/vps_signoff_assert.sh
