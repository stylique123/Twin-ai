name: script-batch

# THE SCRIPT TEST BATCH (owner 2026-10-02). Manual only: ~200 real generations
# on the test account (the heartbeat secrets), each checked by code and stored
# in script_batch_results for the audit. Costs one credit per script.
on:
  workflow_dispatch:
    inputs:
      label:
        description: 'Batch label (results are grouped by it)'
        required: true
        default: 'batch-1'
      limit:
        description: 'Run only the first N scenarios (0 = all)'
        required: false
        default: '0'
      group:
        description: 'Only these groups, comma-separated (product, business, idea, reference, adversarial, repeat, options, fresh, thin, ceiling, paired); empty = all'
        required: false
        default: ''
      judge_only:
        description: 'Only score the scripts an earlier batch wrote (its label); no new builds'
        required: false
        default: ''
      judge2_model:
        description: 'Optional second judge model (one read, same code caps), e.g. claude-sonnet-5-5 (needs the ANTHROPIC_API_KEY repo secret)'
        required: false
        default: ''
      storyload_file_id:
        description: 'Story-load test: id of a private test_run_files row (kind=requests) holding the list. Never paste story text here: inputs are public.'
        required: false
        default: ''
      drafts:
        description: 'Drafts per script, best one kept (1-3; test account only)'
        required: false
        default: '1'
      intake:
        description: 'Also add products from URL / photo / name and test intake'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  batch:
    runs-on: ${{ (!github.event.repository.private || !vars.CI_RUNNER) && 'ubuntu-latest' || vars.CI_RUNNER }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run the batch
        run: |
          npx esbuild packages/shared/src/script/privacyGuard.ts --bundle --format=esm --platform=node --outfile=scripts/ops/.privacyGuard.bundle.mjs
          npx esbuild packages/shared/src/script/novelDetail.ts --bundle --format=esm --platform=node --outfile=scripts/ops/.novelDetail.bundle.mjs
          npx esbuild packages/shared/src/script/storyCraft.ts --bundle --format=esm --platform=node --outfile=scripts/ops/.storyCraft.bundle.mjs
          npx esbuild packages/shared/src/script/blueprintCompliance.ts --bundle --format=esm --platform=node --outfile=scripts/ops/.blueprintCompliance.bundle.mjs
          node scripts/ops/scriptBatch.mjs "$BATCH_LABEL" "$BATCH_LIMIT" ${{ inputs.intake && ' ' || '--no-intake' }} "--group=$BATCH_GROUP" "--judge-only=$JUDGE_ONLY"
        env:
          BATCH_GROUP: ${{ inputs.group }}
          STORYLOAD_FILE_ID: ${{ inputs.storyload_file_id }}
          BATCH_DRAFTS: ${{ inputs.drafts }}
          JUDGE_ONLY: ${{ inputs.judge_only }}
          JUDGE2_MODEL: ${{ inputs.judge2_model }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BATCH_LABEL: ${{ inputs.label }}
          BATCH_LIMIT: ${{ inputs.limit }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HEARTBEAT_USER_EMAIL: ${{ secrets.HEARTBEAT_USER_EMAIL }}
          HEARTBEAT_USER_PASSWORD: ${{ secrets.HEARTBEAT_USER_PASSWORD }}
          HEARTBEAT_REFERENCE_URL: ${{ secrets.HEARTBEAT_REFERENCE_URL }}
