name: Deploy discovery
# Rebuilds the niche-discovery image on the VPS and runs a quick verify pass that
# scrapes the CREATOR-DERIVED niches (free YouTube/TikTok only) so new niches show
# up in the gallery immediately. The daily cron then keeps them fresh.
on:
  workflow_dispatch:
    inputs:
      only_niche:
        description: 'Comma-separated niche(s) to scrape ONLY (targeted run). Empty = full creator-derived sweep.'
        required: false
        default: ''
  push:
    branches: [main]
    paths: ['discovery/**', '.github/workflows/deploy-discovery.yml']
concurrency: { group: deploy-discovery, cancel-in-progress: false }
env:
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER }}
jobs:
  deploy:
    runs-on: ${{ (!github.event.repository.private || !vars.CI_RUNNER) && 'ubuntu-24.04' || vars.CI_RUNNER }}
    steps:
      - name: Server address and login come from repo secrets
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ]; then
            echo "::error::Set the VPS_HOST and VPS_USER repository secrets (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - name: Build + verify discovery over SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          # Pass the untrusted input as an ENV VALUE (never interpolate ${{ }} into a
          # shell command — that was a root-RCE injection). Sanitized below before use.
          ONLY_NICHE_RAW: ${{ github.event.inputs.only_niche }}
        run: |
          if [ -z "$VPS_SSH_KEY" ]; then echo "::error::VPS_SSH_KEY not set"; exit 1; fi
          # Pinned host key, strict verification, fail-closed (same as deploy-worker).
          if [ -z "$VPS_KNOWN_HOSTS" ]; then echo "::error::VPS_KNOWN_HOSTS not set — refusing to SSH without a pinned host key"; exit 1; fi
          mkdir -p ~/.ssh; chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519; chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts_vps"; chmod 600 "$HOME/.ssh/known_hosts_vps"
          # Allowlist: letters/digits/space/comma/underscore/hyphen only, capped length.
          ONLY_NICHE=$(printf '%s' "${ONLY_NICHE_RAW:-}" | tr -cd 'a-zA-Z0-9 ,_-' | cut -c1-200)
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts_vps" "$VPS_USER@$VPS_HOST" \
            "ONLY_NICHE=$(printf %q "$ONLY_NICHE") bash -se" <<'REMOTE'
            set -euo pipefail
            cd /opt/twinai-worker-src
            git fetch origin main
            git reset --hard FETCH_HEAD
            docker build -t twinai-discovery:latest discovery/
            echo "discovery image rebuilt: $(git rev-parse --short HEAD)"
            SUP_URL=$(docker exec twinai-worker printenv SUPABASE_URL)
            SUP_KEY=$(docker exec twinai-worker printenv SUPABASE_SERVICE_ROLE_KEY)
            echo "== verify: creator-derived niches only, free scrapers =="
            docker run --rm \
              -e SUPABASE_URL="$SUP_URL" -e SUPABASE_SERVICE_ROLE_KEY="$SUP_KEY" \
              -e DISCOVERY_NICHES='[]' -e DISCOVERY_YT_LIMIT=4 -e DISCOVERY_TT_LIMIT=4 \
              -e DISCOVERY_ONLY_NICHE="${ONLY_NICHE:-}" \
              twinai-discovery:latest
          REMOTE
