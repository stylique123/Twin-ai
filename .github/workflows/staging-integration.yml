# Editor v2 Phase 1 — the REAL integration gate, run against the DEDICATED
# staging Supabase project (twinai-phase1-staging). Never touches production.
#
# Auth is keyless: the runner proves its identity with a GitHub OIDC token and
# the staging-only `ci-bootstrap` edge function verifies it (issuer + audience +
# exact repository + exact branch) before returning the staging keys. Nothing
# secret lives in this public repository.
#
# The harness exercises the full chain the DB-only tests cannot:
#   client → source-asset edge fn → signed Storage upload → finalize RPC
#   → validate_source job → REAL worker (ffprobe) → ready → generation pointer
# including concurrency, refresh/second-device recovery, token lifecycle,
# a real media rejection matrix, worker kill/recovery, and the retake race.
name: staging-integration

# Runs on every push to an editor-v2 phase branch (the ci-bootstrap credential
# gate only answers to THIS workflow file on those refs or main), and via
# dispatch once the file is on the default branch.
on:
  workflow_dispatch:
  push:
    branches: ['rebuild/editor-v2-*']

permissions:
  id-token: write
  contents: read

# The matrices run against ONE shared staging project — two overlapping runs
# would drain/settle each other's fixtures. Strictly serialize.
concurrency:
  group: staging-integration
  cancel-in-progress: false

jobs:
  integration:
    runs-on: ubuntu-latest
    # Phase 1-6 consume ~40 min; Phase 7 (7 fixtures + 4 full-pipeline runs +
    # a crash-resume + the RPC truth table) adds ~12 min. The old 45-min budget
    # cancelled Phase 7 mid-run, so give the full Phase 1-7 regression headroom.
    timeout-minutes: 70
    # Phases 3-5 all drive the REAL speech stage, which now loads the PINNED
    # snapshot from this path offline (fetched + digest-verified in the install
    # step). Job-level so EVERY phase inherits it, not just Phase 5. NOTE: the
    # `runner` context is NOT available in job-level env — use github.workspace.
    env:
      EDITOR_SPEECH_MODEL_PATH: ${{ github.workspace }}/.pinned-model
      # Phase-6 build provenance: the boot manifest requires a 40-hex commit
      # (editor_pin_manifest rejects a hollow manifest). The staging workers run
      # the built dist/ directly (not the Docker image), so inject the exact
      # head commit here — every spawned worker inherits it via process.env.
      WORKER_GIT_SHA: ${{ github.sha }}
      # Phase-7: the REAL directing stage makes one pinned gemini-3.5-flash call.
      # The spawned staging worker (EDITOR_DIRECTOR_ENABLED=true, set per-worker
      # in phase7.mjs) inherits this key via process.env; Gate 0's real
      # countTokens uses it too. This key is HARD-REQUIRED: without it the
      # Phase-7 A/C sections fail closed (director_no_credentials) — checked
      # up-front below so a missing secret fails in seconds, not after the
      # 40-minute pipeline reaches Phase 7.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install ffmpeg + espeak-ng (fixtures & audio extraction)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg espeak-ng

      # The worker's Phase-5 speech stage shells out to python3 + faster-whisper
      # (phases 3-5 all drive it now that `transcribing` is real). Pinned — a
      # mutable ASR dependency would silently move the component contract.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the worker's pinned Python deps + fetch the PINNED ASR model
        # SAME locked source the Docker image installs from (worker/
        # requirements.txt) — the speech component's ASR/VAD stack is identical
        # in CI and on the VPS.
        run: |
          pip install --quiet -r worker/requirements.txt
          # OpenCV runtime with ENFORCED wheel SHA-256 (same as the Docker build):
          # --require-hashes fails the install if the wheel bytes don't match.
          pip install --quiet --require-hashes -r worker/requirements-opencv.txt
          # Offline verifier guard (mirror of the build): a digest mismatch must fail.
          python worker/scripts/test_fetch_model.py
          python worker/scripts/test_editor_speech_pin.py
          python worker/scripts/test_editor_speech_offline.py
          # tiny = the fast model Phase-3/4 pin (alias is fine — not immutable).
          python -c "from faster_whisper import WhisperModel; WhisperModel('tiny', device='cpu', compute_type='int8')"
          # small = the SHIPPED Phase-5 model — fetch the EXACT pinned revision and
          # digest-verify it (speech-6). Same fetch_model.py the Docker build runs.
          python worker/scripts/fetch_model.py \
            --manifest worker/models/faster-whisper-small.manifest.json \
            --dest "$GITHUB_WORKSPACE/.pinned-model"

      - name: Verify the ci-bootstrap gate refuses unauthorized callers
        run: |
          # (a) no token → 400
          A=$(curl -s -o /dev/null -w '%{http_code}' -X POST "https://otgzjsagybpgtwweuptj.supabase.co/functions/v1/ci-bootstrap" \
            -H 'Content-Type: application/json' -d '{}')
          # (b) garbage token → 403
          B=$(curl -s -o /dev/null -w '%{http_code}' -X POST "https://otgzjsagybpgtwweuptj.supabase.co/functions/v1/ci-bootstrap" \
            -H 'Content-Type: application/json' -d '{"token":"eyJhbGciOiJSUzI1NiJ9.eyJmYWtlIjp0cnVlfQ.forged"}')
          # (c) REAL OIDC token but the WRONG audience → 403 (proves the gate
          # verifies claims, not just signatures)
          WRONG=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=some-other-audience" | jq -r .value)
          C=$(curl -s -o /dev/null -w '%{http_code}' -X POST "https://otgzjsagybpgtwweuptj.supabase.co/functions/v1/ci-bootstrap" \
            -H 'Content-Type: application/json' -d "{\"token\":\"$WRONG\"}")
          echo "no-token=$A garbage=$B wrong-audience=$C"
          [ "$A" = "400" ] && [ "$B" = "403" ] && [ "$C" = "403" ] || { echo "BOOTSTRAP GATE FAILED TO REFUSE"; exit 1; }

      - name: Fetch staging credentials via GitHub OIDC (keyless)
        run: |
          OIDC=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=twinai-staging-integration" | jq -r .value)
          RESP=$(curl -sS -X POST "https://otgzjsagybpgtwweuptj.supabase.co/functions/v1/ci-bootstrap" \
            -H 'Content-Type: application/json' -d "{\"token\":\"$OIDC\"}")
          SERVICE=$(echo "$RESP" | jq -r .serviceRoleKey)
          ANON=$(echo "$RESP" | jq -r .anonKey)
          URL=$(echo "$RESP" | jq -r .url)
          if [ -z "$SERVICE" ] || [ "$SERVICE" = "null" ]; then
            echo "bootstrap failed: $(echo "$RESP" | jq -r '.error // "no error field"')"; exit 1
          fi
          # NON-SECRET credential diagnostic: the selection source (key NAME only)
          # and the literal, non-secret key PREFIX (sb_secret_ / sb_publishable_ /
          # eyJhbGciOi… for a JWT) — the first 10 chars are a fixed format marker,
          # never the random secret body. Bisects "wrong key selected" vs
          # "sb_secret_ rejected by GoTrue" without exposing any credential.
          echo "credential source: $(echo "$RESP" | jq -r '.keySource // "none"')"
          echo "credential head:   ${SERVICE:0:10}"
          echo "::add-mask::$SERVICE"
          {
            echo "STAGING_URL=$URL"
            echo "STAGING_ANON_KEY=$ANON"
            echo "STAGING_SERVICE_ROLE_KEY=$SERVICE"
          } >> "$GITHUB_ENV"

      # Pinned (not 'latest'): resolving the latest release hits the GitHub API
      # unauthenticated from shared runner IPs and rate-limits sporadically —
      # and a mutable toolchain weakens reproducibility anyway.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Deploy THIS BRANCH's editor edge functions to STAGING
        # The functions under test must be the branch's code, not a hand-pushed
        # copy. Deploys ONLY to the staging project — production deploys stay
        # exclusively on deploy-edge.yml (main).
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set"; exit 1
          fi
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY secret is not set — Phase 7 A/C would fail closed 40 minutes in"; exit 1
          fi
          supabase functions deploy source-asset --project-ref otgzjsagybpgtwweuptj
          supabase functions deploy start-editor-v2 --project-ref otgzjsagybpgtwweuptj

      - name: Apply the editor migrations to STAGING (byte-exact) and assert the schema
        # The matrix must run against the EXACT migration files in THIS checkout
        # (the audit's requirement: "with 0091/0092 actually applied").
        #
        # Deliberately NOT `supabase db push`: staging's migration ledger records
        # timestamp versions (20260717140819 named "0076_media_assets") while the
        # repo's files are version-prefixed (0076_…), so the CLI would judge EVERY
        # local migration unapplied and try to replay the whole history onto a
        # populated database. Instead apply the three editor migrations explicitly
        # with psql. All three are idempotent (create-or-replace / if-not-exists /
        # drop-if-exists), so re-running is a safe no-op, and the file is copied
        # byte-for-byte — never re-typed.
        #
        # STAGING ONLY. Production (jmdecibuytznsonrasxw) is never referenced here.
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: |
          if [ -z "$STAGING_DB_URL" ]; then
            echo "::error::STAGING_DB_URL secret is not set — the editor migrations cannot be applied byte-exactly, so the matrix would run against a schema that does not match this checkout."
            exit 1
          fi
          case "$STAGING_DB_URL" in
            *otgzjsagybpgtwweuptj*) : ;;
            *) echo "::error::STAGING_DB_URL does not point at the staging project ref — refusing to apply."; exit 1 ;;
          esac
          # GitHub-hosted runners have NO IPv6, and Supabase's DIRECT database host
          # (db.<ref>.supabase.co) resolves to IPv6 only — psql fails with "Network is
          # unreachable". The connection POOLER (Supavisor) is IPv4-reachable, so CI
          # must use the pooler URI. Detect the direct host and say exactly what to fix
          # rather than failing with an opaque network error.
          case "$STAGING_DB_URL" in
            *db.otgzjsagybpgtwweuptj.supabase.co*)
              echo "::error::STAGING_DB_URL uses the DIRECT database host (db.<ref>.supabase.co), which is IPv6-only — GitHub runners cannot reach it. Use the Session pooler URI instead: Supabase dashboard -> Project Settings -> Database -> Connection string -> 'Session pooler' (host aws-<n>-<region>.pooler.supabase.com, port 5432, user postgres.otgzjsagybpgtwweuptj)."
              exit 1 ;;
          esac
          # A connection URI carries the password inside the authority, so a password
          # containing a RESERVED character silently repartitions the URI: libpq splits
          # at the first '@', the rest of the password becomes part of the host, and the
          # failure surfaces as an opaque "could not translate host name". Count the
          # delimiters (never print them — this is a secret) and say exactly what to fix.
          authority=${STAGING_DB_URL#*://}
          at_count=$(printf '%s' "$authority" | tr -cd '@' | wc -c | tr -d ' ')
          if [ "$at_count" != "1" ]; then
            # The encoding table goes to the plain log, NOT the ::error:: annotation:
            # Actions percent-DECODES annotation text, so a literal %25 in an annotation
            # renders as a bare '%' and the instruction contradicts itself.
            echo "STAGING_DB_URL fix — percent-encode these characters in the PASSWORD:"
            echo "    @ -> %40      : -> %3A      / -> %2F"
            echo "    # -> %23      ? -> %3F      % -> %25"
            echo "  Shape: postgresql://postgres.otgzjsagybpgtwweuptj:<ENCODED-PASSWORD>@aws-<n>-<region>.pooler.supabase.com:5432/postgres"
            echo "  (exactly one '@' in the whole string — the one before the host)"
            echo "::error::STAGING_DB_URL contains $at_count '@' characters after '://' — a connection URI may contain exactly one, separating credentials from host. The PASSWORD contains a reserved character that must be percent-encoded; see the encoding table printed above this annotation."
            exit 1
          fi
          hostport=${authority#*@}
          case "${hostport%%/*}" in
            *pooler.supabase.com:5432) : ;;
            *) echo "::error::STAGING_DB_URL host is not the Session pooler on port 5432. Expected aws-<n>-<region>.pooler.supabase.com:5432 (Supabase dashboard -> Project Settings -> Database -> Connection string -> 'Session pooler')."; exit 1 ;;
          esac
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends postgresql-client
          # Prove the connection BEFORE touching schema: a credential problem must not
          # surface as a half-applied migration.
          if ! psql "$STAGING_DB_URL" -v ON_ERROR_STOP=1 -q -c 'select 1' >/dev/null; then
            echo "::error::Could not connect to STAGING with STAGING_DB_URL (see the psql error above). Nothing was applied. Re-copy the Session pooler connection string and percent-encode the password."
            exit 1
          fi
          # THIS LIST IS EXPLICIT, AND THAT IS A TRAP WORTH NAMING. It is not
          # "the committed migrations" — it is four of them, chosen by hand. A
          # migration added to supabase/migrations/ does NOT reach staging by
          # being committed; it reaches staging by being added HERE. Anything
          # that assumes otherwise runs against a schema that does not contain
          # it, and the symptom is a phase failing for a reason that looks
          # nothing like a missing table.
          #
          # 0094 is added because phase7's edit_plans assertions now READ that
          # table instead of coalescing the error to zero. Without it applied,
          # A9/F4 fail — correctly, since they can no longer pretend an
          # unreadable table means no rows.
          #
          # NOT ADDED: 0095 (Track C creative-transfer lineage). It is on main
          # and has never been applied to staging. Nothing in Phases 1-7 reads
          # those tables so nothing fails today, but that is a schema drift
          # between main and staging, and it belongs to Track C's lane to close
          # rather than being silently swept in here.
          for f in 0090_editor_capture_intent 0091_editor_capture_hardening 0092_editor_director_decision_v2 0093_editor_capture_retention_cascade 0094_editor_editplan_render_completion 0096_editor_output_asset_and_completion; do
            echo "== applying $f =="
            psql "$STAGING_DB_URL" -v ON_ERROR_STOP=1 -q -f "supabase/migrations/$f.sql"
          done
          # STAGING-ONLY fixture, never a migration: staging is a purpose-built
          # editor test bed with no brand tables, and the Phase-7 Boot Manifest now
          # pins the brand snapshot CONTENT, so every editor_v2 job reads
          # brand_voices. Production already has this table from 0002/0043 and gets
          # nothing from here. Idempotent.
          echo "== applying the staging-only brand fixture =="
          psql "$STAGING_DB_URL" -v ON_ERROR_STOP=1 -q -f scripts/staging-integration/staging-brand-schema.sql

          echo "== asserting the required schema objects exist =="
          psql "$STAGING_DB_URL" -v ON_ERROR_STOP=1 -q -c "
            do \$\$
            begin
              if to_regclass('public.brand_voices') is null then raise exception 'missing table brand_voices (staging brand fixture) — the Boot Manifest brand pin cannot resolve'; end if;
              if to_regclass('public.source_capture_intents')   is null then raise exception 'missing table source_capture_intents (0090)'; end if;
              if to_regclass('public.source_capture_manifests') is null then raise exception 'missing table source_capture_manifests (0090)'; end if;
              if to_regclass('public.source_script_snapshots')  is null then raise exception 'missing table source_script_snapshots (0091)'; end if;
              if to_regproc('public.editor_create_source_asset') is null then raise exception 'missing fn editor_create_source_asset (0091)'; end if;
              if to_regproc('public.editor_validate_source')     is null then raise exception 'missing fn editor_validate_source (0091)'; end if;
              if to_regproc('public.editor_assert_director_decision_v2') is null then raise exception 'missing fn editor_assert_director_decision_v2 (0092)'; end if;
              if not exists (select 1 from pg_trigger where tgname='trg_editor_director_decision_guard')
                then raise exception 'missing trigger trg_editor_director_decision_guard (0092)'; end if;
            end
            \$\$;"
          echo "staging schema matches this checkout (0090-0093 + brand fixture applied)"

      - name: Build worker (the real one that will run in production)
        run: cd worker && npm ci && npm run build

      - name: Harness dependency
        run: npm i --no-save --no-audit --no-fund @supabase/supabase-js@2

      - name: Prove the DISABLED start gate (env unset = fail closed)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase secrets unset EDITOR_V2_START_ENABLED --project-ref otgzjsagybpgtwweuptj || true
          sleep 20   # secret changes restart the function runtime
          node scripts/staging-integration/phase2-disabled.mjs

      - name: Prove an INVALID gate value stays disabled (only exactly 'true' enables)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase secrets set EDITOR_V2_START_ENABLED=1 --project-ref otgzjsagybpgtwweuptj
          sleep 20
          node scripts/staging-integration/phase2-disabled.mjs

      - name: Enable the start gate for the staging matrices
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase secrets set EDITOR_V2_START_ENABLED=true --project-ref otgzjsagybpgtwweuptj
          sleep 20

      - name: Run Phase 1 integration matrix (source-asset chain)
        run: node scripts/staging-integration/run.mjs

      - name: Run Phase 2 integration matrix (start-editor-v2)
        run: node scripts/staging-integration/phase2.mjs

      - name: Run Phase 3 integration matrix (editor_v2 worker orchestration)
        run: node scripts/staging-integration/phase3.mjs

      - name: Run Phase 4 integration matrix (real media inspection)
        run: node scripts/staging-integration/phase4.mjs

      - name: Run Phase 5 integration matrix (real speech transcription)
        # EDITOR_SPEECH_MODEL_PATH is set at job level (all phases drive speech).
        run: node scripts/staging-integration/phase5.mjs

      - name: Run Phase 6 integration matrix (real analyzing — manifest pin, digest components, capacity)
        # opencv-python-headless is installed by the pinned requirements step
        # above; the YuNet .onnx + vision manifest are committed in-repo.
        run: node scripts/staging-integration/phase6.mjs

      - name: Run Phase 7 integration matrix (real directing — Director call, decision, filler guards)
        # Requires migration 0088 (edit_director_calls/decisions + RPCs) applied
        # to staging. EDITOR_DIRECTOR_ENABLED is set PER-WORKER inside phase7.mjs
        # (never a Supabase secret) so production stays simulated. GEMINI_API_KEY
        # is threaded via job env above.
        run: node scripts/staging-integration/phase7.mjs

      - name: Run Phase 8 integration matrix (REAL render — the only thing that runs the renderer)
        # Phases 1-7 leave EDITOR_RENDER_ENABLED unset, so compiling/rendering/
        # validating are unreachable code in every one of them. This phase is
        # the ONLY place the renderer executes, and it asserts on the ARTIFACT
        # (bytes in storage, ffprobe streams, duration within the frozen
        # tolerance) rather than on the project status, which a scaffold
        # produces identically.
        run: node scripts/staging-integration/phase8.mjs
