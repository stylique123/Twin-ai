<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0;background:#0B0B0E}a{color:inherit}</style>
<style>
@keyframes pin{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(80px,40px) scale(1.15)}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-70px,-50px) scale(1.1)}}
@keyframes shine{0%{transform:translateX(-120%) skewX(-20deg)}60%,100%{transform:translateX(260%) skewX(-20deg)}}
@keyframes recp{0%{box-shadow:0 0 0 0 rgba(255,255,255,.7)}100%{box-shadow:0 0 0 8px rgba(255,255,255,0)}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,91,123,.45)}100%{box-shadow:0 0 0 14px rgba(255,91,123,0)}}
@keyframes spinb{to{transform:rotate(360deg)}}
@keyframes hue{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes dot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-8deg)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes seg{from{opacity:.15}to{opacity:1}}
.pin{opacity:0;animation:pin .7s cubic-bezier(.22,1,.36,1) forwards}
.d1{animation-delay:.05s}.d2{animation-delay:.15s}.d3{animation-delay:.25s}.d4{animation-delay:.35s}.d5{animation-delay:.45s}.d6{animation-delay:.55s}.d7{animation-delay:.65s}.d8{animation-delay:.75s}
.lv{position:relative}.lv>*{position:relative;z-index:1}.lv>.aur{position:absolute;z-index:0}
.lift{transition:transform .25s cubic-bezier(.22,1,.36,1),box-shadow .25s ease,border-color .25s ease}
.lift:hover{transform:translateY(-4px);box-shadow:0 18px 40px -18px rgba(0,0,0,.9);border-color:rgba(255,255,255,.18)!important}
.row{transition:background .2s ease,padding .2s ease}.row:hover{background:rgba(255,255,255,.04);padding-left:24px!important}
.cta{position:relative;overflow:hidden;transition:transform .2s ease,box-shadow .2s ease}
.cta::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:shine 3.2s ease-in-out infinite}
.cta:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 16px 40px -12px rgba(255,91,123,.7)}
.recdot{animation:recp 1.4s ease-out infinite}
.ringp{animation:ring 1.8s ease-out infinite}
.grad{background:linear-gradient(110deg,#FFB347,#FF5B7B,#65E5D8,#FFB347);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:hue 6s ease infinite}
.gbtn{background:linear-gradient(110deg,#FFB347,#FF5B7B 55%,#65E5D8);background-size:200% 100%;animation:hue 5s ease infinite}
.bob{animation:bob 3s ease-in-out infinite}
.wave{display:inline-block;transform-origin:70% 80%;animation:wave 2.4s ease-in-out 1s infinite}
.dots span{display:inline-block;width:5px;height:5px;border-radius:9px;background:#FF8FA4;animation:dot 1.2s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
.grow{transform-origin:left;animation:grow 1.2s cubic-bezier(.22,1,.36,1) .4s both}
.seg{opacity:.15;animation:seg .3s ease forwards}
@keyframes blink{50%{opacity:0}}
@keyframes popin{0%{opacity:0;transform:translateY(10px) scale(.94)}100%{opacity:1;transform:none}}
@keyframes scan{0%{top:-30%}100%{top:110%}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-10px) rotate(var(--r,0deg))}}
@keyframes orbit{to{transform:rotate(360deg)}}
.caret{display:inline-block;width:2px;height:1em;margin-left:2px;vertical-align:-2px;background:#FF5B7B;animation:blink 1s steps(1) infinite}
.pop{animation:popin .5s cubic-bezier(.22,1,.36,1) both}
.floaty{animation:floaty 5s ease-in-out infinite}
.chip{transition:transform .18s ease,background .18s ease,border-color .18s ease,color .18s ease;cursor:pointer}
.chip:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.28)!important}
.inp{transition:border-color .2s ease,box-shadow .2s ease}.inp:focus{border-color:rgba(255,91,123,.6)!important;box-shadow:0 0 0 4px rgba(255,91,123,.14)}
@keyframes wv{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
.wv{display:inline-flex;align-items:center;gap:3px;height:20px}.wv span{display:block;width:3px;height:20px;border-radius:2px;background:#FF5B7B;transform-origin:center;animation:wv .9s ease-in-out infinite}
.wv span:nth-child(2){animation-delay:.12s}.wv span:nth-child(3){animation-delay:.24s}.wv span:nth-child(4){animation-delay:.36s}.wv span:nth-child(5){animation-delay:.48s}.wv span:nth-child(6){animation-delay:.2s}.wv span:nth-child(7){animation-delay:.05s}
.sel{transition:transform .18s ease,border-color .2s ease,background .2s ease,box-shadow .2s ease;cursor:pointer}.sel:hover{transform:translateY(-3px)}
.card{border-radius:18px;background:#111115;border:1px solid rgba(255,255,255,0.07)}
.lbl{font-size:11.5px;font-weight:700;letter-spacing:.12em;color:#8D8475}
.btnL{white-space:nowrap;flex-shrink:0;padding:12px 18px;border-radius:12px;border:0;background:#F6F1E9;color:#0B0B0E;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btnG{white-space:nowrap;padding:12px 16px;border-radius:12px;border:1px solid rgba(255,255,255,0.12);background:transparent;color:#D8CFC2;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.opt{padding:13px 15px;border-radius:12px;border-width:1px;border-style:solid;font-family:inherit;font-size:14.5px;font-weight:500;text-align:left;cursor:pointer;transition:all .15s ease}
.opt:hover{transform:translateY(-1px)}
.fld{min-width:0;box-sizing:border-box;padding:12px 14px;border-radius:11px;border:1px solid rgba(255,255,255,0.1);background:#0B0B0E;color:#F6F1E9;font-family:inherit;font-size:15px;outline:none}
.fld:focus{border-color:rgba(255,91,123,.6);box-shadow:0 0 0 4px rgba(255,91,123,.12)}
.guess{padding:2px 8px;border-radius:99px;background:rgba(255,179,71,.14);color:#FFB347;font-size:10.5px;font-weight:700;letter-spacing:.05em}
.cam{position:absolute;inset:0;background:radial-gradient(120% 80% at 0% 30%,rgba(255,196,128,.32),rgba(255,196,128,0) 55%),radial-gradient(90% 60% at 50% 100%,#2B2024,#141015 70%),#141015}
.who{position:absolute;left:50%;bottom:0;width:62%;transform:translateX(-50%)}
.who i{display:block;margin:0 auto;width:44%;aspect-ratio:1/1.18;border-radius:999px;border:1.5px dashed rgba(246,241,233,.28);box-sizing:border-box}
.who b{display:block;margin-top:10px;height:260px;border-radius:140px 140px 0 0;border:1.5px dashed rgba(246,241,233,.2);border-bottom:0;box-sizing:border-box}
.fade{-webkit-mask-image:linear-gradient(180deg,transparent,#000 22%,#000 78%,transparent);mask-image:linear-gradient(180deg,transparent,#000 22%,#000 78%,transparent)}
.ctl{white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:5px;padding:0;border:0;background:transparent;color:#F6F1E9;font-family:inherit;font-size:11.5px;font-weight:600}
.ctl span.ic{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center}
.big{font-variant-numeric:tabular-nums}
@keyframes cdz{0%{transform:scale(1.4);opacity:0}25%{transform:scale(1);opacity:1}100%{transform:scale(.9);opacity:.85}}
.cdz{animation:cdz 1s ease-out infinite}
@keyframes lvl{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
.lvl span{display:inline-block;width:4px;height:16px;border-radius:3px;background:#65E5D8;transform-origin:bottom;animation:lvl .9s ease-in-out infinite}
.lvl span:nth-child(2){animation-delay:.12s}.lvl span:nth-child(3){animation-delay:.24s}.lvl span:nth-child(4){animation-delay:.36s}.lvl span:nth-child(5){animation-delay:.48s}
@keyframes bar{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.indet{position:relative;overflow:hidden}.indet::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:bar 1.4s linear infinite}
.scene{position:absolute;inset:0;background:radial-gradient(60% 45% at 25% 30%,rgba(255,214,160,.35),rgba(255,214,160,0) 70%),radial-gradient(18% 12% at 72% 22%,rgba(255,255,255,.18),rgba(255,255,255,0)),radial-gradient(14% 10% at 82% 38%,rgba(255,200,150,.14),rgba(255,200,150,0)),radial-gradient(70% 50% at 55% 85%,rgba(0,0,0,.45),rgba(0,0,0,0)),linear-gradient(180deg,rgba(255,255,255,.03),rgba(0,0,0,.25));filter:saturate(1.1)}
.scene::after{content:"";position:absolute;inset:0;opacity:.18;background-image:repeating-radial-gradient(circle at 17% 32%,rgba(255,255,255,.06) 0 1px,transparent 1px 3px)}
@view-transition{navigation:auto}
::view-transition-old(root){animation:vtOut .32s cubic-bezier(.4,0,1,1) both}
::view-transition-new(root){animation:vtIn .6s cubic-bezier(.22,1,.36,1) both}
@keyframes vtOut{to{opacity:0;transform:perspective(1600px) translateZ(-60px) rotateX(2deg)}}
@keyframes vtIn{from{opacity:0;transform:perspective(1600px) translateY(18px) translateZ(40px) rotateX(-2deg)}}
@keyframes pageIn{from{opacity:0}to{opacity:1}}
.lv{animation:pageIn .45s ease-out both}
a,button{transition:transform .15s ease,opacity .2s ease,background-color .2s ease,border-color .2s ease}
button:active,a.cta:active,a.btnL:active,a.btnG:active{transform:scale(.97)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;opacity:1!important;transition:none!important}}
.tourbg{background-image:url(../assets/images/tour-background-phone.jpg);background-size:100% 100%;background-repeat:no-repeat}
</style>
</helmet>
<div class="brandbg bgm lv" style="position: relative; width: 390px; height: 844px; background: #0B0B0E; font-family: Geist, system-ui, sans-serif; color: #F6F1E9; overflow: hidden; overflow: clip">
<div class="tourbg" aria-hidden="true" style="position: absolute; inset: 0; width: 390px; height: 844px; pointer-events: none"></div>

<span class="ringp" style="width: 64px; height: 64px; border-radius: 20px; background: linear-gradient(110deg,#FFB347,#FF5B7B 55%,#65E5D8); display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true"><rect x="6" y="4.6" width="12" height="2.7" rx="1.35" fill="#07070A"></rect><rect x="10.65" y="7.3" width="2.7" height="9.4" fill="#07070A"></rect><rect x="6" y="16.7" width="12" height="2.7" rx="1.35" fill="#07070A"></rect></svg></span>
<b style="font-size: 24px; letter-spacing: -0.02em">{{ t }}</b><span style="font-size: 15px; line-height: 1.55; color: #B7AE9F">{{ b }}</span>
<sc-if value="{{ start }}" hint-placeholder-val="{{ true }}"><span style="display: flex; flex-direction: column; gap: 8px; width: 100%; margin-top: 8px"><button type="button" onClick="{{ next }}" class="cta gbtn" style="padding: 14px; border-radius: 13px; border: 0; color: #0B0B0E; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer">Show me around</button><button type="button" onClick="{{ skip }}" style="padding: 8px; border: 0; background: transparent; color: #8D8475; font-family: inherit; font-size: 13.5px; cursor: pointer">Skip, I’ll explore</button></span></sc-if>
<sc-if value="{{ end }}" hint-placeholder-val="{{ false }}"><span style="display: flex; flex-direction: column; gap: 8px; width: 100%; margin-top: 8px"><a href="MScript.dc.html" class="cta gbtn" style="padding: 14px; border-radius: 13px; color: #0B0B0E; font-size: 15px; font-weight: 700; text-decoration: none">Open my first script</a><button type="button" onClick="{{ replay }}" style="padding: 8px; border: 0; background: transparent; color: #8D8475; font-family: inherit; font-size: 13.5px; cursor: pointer">Replay the tour</button></span></sc-if>
</div></div></sc-if>
</div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {}; const i = s.i || 0; const mob = true;
    const D = [
      { t: 'Welcome, Maya', b: 'Here’s how your twin works, in five quick stops. It takes about a minute.', modal: true },
      { t: 'Start every video here', b: 'Pick a thought, a video you liked, something you sell, or what’s happening in your niche. Twin writes the script in your voice.', r: [16, 112, 216, 40], c: [260, 92], mr: [157, 766, 75, 52], mc: [20, 520] },
      { t: 'Your first script is ready', b: 'Twin already wrote one from your own videos. Open it, pick how you open, read it once, then film.', r: [310, 300, 1066, 372], c: [700, 690], mr: [14, 104, 362, 180], mc: [20, 300] },
      { t: 'Every script, one place', b: 'Each script shows exactly what’s left: open, read, film, post. Nothing gets lost.', r: [16, 150, 216, 40], c: [260, 130], mr: [83, 766, 75, 52], mc: [20, 520] },
      { t: 'Your week, posted on time', b: 'Finished videos go out here, to every account, at the times your viewers watch most.', r: [16, 226, 216, 40], c: [260, 206], mr: [232, 766, 75, 52], mc: [20, 520] },
      { t: 'Everything Twin knows about you', b: 'Your voice, your topics, what works for you. Anything that isn’t right, turn it off.', r: [16, 306, 216, 40], c: [260, 286], mr: [307, 766, 75, 52], mc: [20, 520] },
      { t: 'You’re set', b: 'Replay this tour any time from Settings → How it works.', modal: true, end: true }
    ];
    const d = D[i]; const r = mob ? d.mr : d.r; const c = mob ? d.mc : d.c;
    return {
      modal: !!d.modal, spot: !d.modal, end: !!d.end, start: i === 0,
      t: d.t, b: d.b, n: i > 0 && i < 6 ? i + ' of 5' : '',
      sx: r ? r[0] + 'px' : '0', sy: r ? r[1] + 'px' : '0', sw: r ? r[2] + 'px' : '0', sh: r ? r[3] + 'px' : '0',
      cx: c ? c[0] + 'px' : '0', cy: c ? c[1] + 'px' : '0',
      next: () => this.setState({ i: Math.min(6, i + 1) }), back: () => this.setState({ i: Math.max(0, i - 1) }), canBack: i > 1 && i < 6, skip: () => this.setState({ i: 6 }), replay: () => this.setState({ i: 0 }),
      nextLbl: i === 5 ? 'Finish' : 'Next',
      dots: [1, 2, 3, 4, 5].map(k => ({ w: k === i ? 18 : 6, c: k < i ? '#65E5D8' : (k === i ? '#F6F1E9' : 'rgba(255,255,255,0.2)') }))
    };
  }
}
</script>
