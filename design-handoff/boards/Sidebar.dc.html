<div style="width: 32px; height: 32px; border-radius: 999px; background: #3A2A22; color: #FFB347; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">M</div>
<div style="display: flex; flex-direction: column; min-width: 0"><span style="font-size: 13px; font-weight: 600">Maya</span><span style="font-size: 12px; color: #8D8475; white-space: nowrap">Maya’s Coffee</span></div>
