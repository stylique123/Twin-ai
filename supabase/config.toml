project_id = "twinai"

[functions.generate-blueprint]
verify_jwt = true

[functions.start-dna]
verify_jwt = true

[functions.dna-poll]
verify_jwt = true

[functions.ingest-reference]
verify_jwt = true

# Editor v2: source-upload intents + finalization (owner-authenticated).
[functions.source-asset]
verify_jwt = true

# Phase 12 item 13: create/finalize for a SCREEN CAPTURE (owner-authenticated).
# A separate function from source-asset rather than a mode on it: that function's
# core is parity-tested against the DB's capture contract — the script snapshot,
# its SHA, the intent row — and a clip has none of that, so a clip branch inside
# it would thread a second path through assertions written about takes.
[functions.clip-asset]
verify_jwt = true

# Editor v2: the ONLY way an edit begins (owner-authenticated; Phase 2).
[functions.start-editor-v2]
verify_jwt = true

# Editor v2: the ONLY way a finished edit is fetched (owner-strict; Phase 8
# Batch 8.6). Deliberately NOT gated by EDITOR_V2_START_ENABLED — that switch
# governs whether new edits may BEGIN, and turning it off must never make an
# already-finished video unplayable.
[functions.editor-output]
verify_jwt = true

[functions.admin]
verify_jwt = true

[functions.billing]
verify_jwt = true

# Payment-provider webhook: callable by the processor (which sends no Supabase
# JWT), so JWT verification MUST be off. The function does its own HMAC signature
# verification. Without this entry it defaults to verify_jwt=true and every real
# webhook is rejected with 401.
[functions.billing-webhook]
verify_jwt = false

# Social posting: the OAuth callback is hit by the browser redirect with no
# Supabase JWT, so verification MUST be off. start/publish/disconnect authenticate
# manually from the Authorization header; the callback authenticates from a signed
# `state`. Without this it defaults to verify_jwt=true and the OAuth round-trip 401s.
[functions.social]
verify_jwt = false

# Client approval: the client opens /review/:token with no Supabase JWT. The
# unguessable review_token is the access control; without this it would 401.
[functions.review]
verify_jwt = false

# Explicit for auditability — these default to verify_jwt = true anyway, and each
# also checks getUser() internally. Declared so the gateway posture is visible.
[functions.admin-metrics]
verify_jwt = true

[functions.brand-logo]
verify_jwt = true

# ⚠️ verify_jwt MATTERS HERE. This endpoint writes to storage with the service
# role on the caller's behalf; without JWT verification it would accept an
# unauthenticated upload and file it under whatever user the body claimed.
[functions.product-image]
verify_jwt = true

[functions.referral]
verify_jwt = true

[functions.generate-thumbnail]
verify_jwt = true

# Answer/skip a needs_user beat's question (FIX 1). Owner-authenticated;
# patches blueprint.script[i] and, on a real answer, creator_knowledge.
[functions.answer-beat-ask]
verify_jwt = true

# The visual pilot's labelling page. A normal authenticated Twin admin session
# is the access control; the function checks platform_admins with the service
# role before it will read or write anything.
[functions.pilot-review]
verify_jwt = true
