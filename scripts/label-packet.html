<!doctype html>
<meta charset="utf-8"><title>Visual claim labels</title>
<!--
  ⚠️ ONE CLAIM AT A TIME, WITH ITS FRAMES ALREADY ON SCREEN. The friction this
  replaces is reading JSON and cross-referencing frame numbers by hand. If the
  human has to go looking for the evidence, the packet has failed at its only job.

  ⚖️ NOTHING HERE SUGGESTS AN ANSWER. No default selection, no highlighted
  "likely" button, no model confidence. A packet that nudged would be measuring
  its own nudge.
-->
<style>
  :root { color-scheme: dark }
  body { margin:0; background:#0d0f12; color:#e8eaed; font:15px/1.5 system-ui, sans-serif }
  main { max-width:1100px; margin:0 auto; padding:24px }
  .bar { height:4px; background:#22262c; border-radius:2px; overflow:hidden; margin-bottom:20px }
  .bar > i { display:block; height:100%; background:#4a9eff; transition:width .2s }
  .meta { color:#8b93a1; font-size:13px; display:flex; gap:16px; margin-bottom:8px }
  .claim { font-size:26px; font-weight:600; margin:12px 0 4px }
  .value { font-size:20px; color:#4a9eff; margin-bottom:20px }
  .value.none { color:#e0a33a }
  .frames { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:24px }
  figure { margin:0 }
  figure img { max-height:340px; border-radius:8px; display:block; background:#22262c }
  figcaption { color:#8b93a1; font-size:12px; margin-top:6px; text-align:center }
  .nocite { color:#e0a33a; padding:24px; border:1px dashed #3a4049; border-radius:8px }
  button { font:inherit; padding:14px 18px; border-radius:8px; border:1px solid #3a4049;
           background:#171a1f; color:#e8eaed; cursor:pointer; text-align:left }
  button:hover { border-color:#4a9eff }
  button b { display:block; font-size:15px }
  button span { color:#8b93a1; font-size:13px }
  .labels { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px }
  .canon { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px }
  .canon button { padding:8px 12px }
  .canon.on button.sel { border-color:#4a9eff; background:#1d2530 }
  .skip { color:#8b93a1; background:none; border:none; padding:8px 0; cursor:pointer }
  .done { text-align:center; padding:80px 20px }
  kbd { background:#22262c; border-radius:4px; padding:1px 6px; font-size:12px }
</style>
<main>
  <div class="bar"><i id="bar"></i></div>
  <div id="app"></div>
</main>
<script>
const LABELS = [
  ['SUPPORTED', 'The frames show this.'],
  ['UNSUPPORTED', 'The frames contradict this.'],
  ['INDETERMINATE', 'These frames cannot settle it.'],
  ['WRONG_EVIDENCE', 'Right claim, wrong frame.'],
]
let rows = [], i = 0, corrected = null

const post = (path, body) => fetch(path, { method:'POST', body: JSON.stringify(body) })

async function boot() {
  const r = await (await fetch('/claims')).json()
  rows = r.labels
  // ⚠️ RESUME WHERE THE HUMAN STOPPED. A packet that restarted at zero would
  // spend the session re-answering, and the re-answers are not independent.
  i = rows.findIndex((x) => x.label === null)
  if (i < 0) i = rows.length
  render()
}

function render() {
  const app = document.getElementById('app')
  const done = rows.filter((x) => x.label !== null).length
  document.getElementById('bar').style.width = (100 * done / rows.length) + '%'

  if (i >= rows.length) {
    app.innerHTML = '<div class="done"><h2>All ' + rows.length + ' claims answered.</h2>'
      + '<p>Now lock the session — the numbers stay hidden until you do.</p>'
      + '<p><code>node scripts/label-packet.mjs --lock</code></p></div>'
    return
  }
  const c = rows[i]
  corrected = c.correctedValue ?? null

  const frames = c.frames.length
    ? c.frames.map((n) => '<figure><img src="/frame?url=' + encodeURIComponent(c.url) + '&i=' + n
        + '" alt=""><figcaption>frame ' + n + '</figcaption></figure>').join('')
    // ⚖️ A CLAIM WITH NO CITATION IS ITS OWN FINDING, said plainly rather than
    // rendered as an empty row the eye slides past.
    : '<div class="nocite">The model cited no frame for this. There is no evidence to judge.</div>'

  app.innerHTML =
    '<div class="meta"><span>' + (done + 1) + ' of ' + rows.length + '</span><span>' + c.url + '</span></div>'
    + '<div class="claim">' + c.path + '</div>'
    + '<div class="value' + (c.answered ? '' : ' none') + '">'
      + (c.answered ? String(c.value) : 'the model did not answer this') + '</div>'
    + '<div class="frames">' + frames + '</div>'
    + (c.canonical ? '<div class="canon on" id="canon">' + c.canonical.map((v) =>
        '<button data-v="' + v + '" class="' + (corrected === v ? 'sel' : '') + '">' + v + '</button>').join('')
        + '</div>' : '')
    + '<div class="labels">' + LABELS.map(([k, t], n) =>
        '<button data-l="' + k + '"><b>' + k + ' <kbd>' + (n + 1) + '</kbd></b><span>' + t + '</span></button>').join('')
      + '</div>'
    + '<button class="skip" data-skip="1">Skip — come back to this one <kbd>s</kbd></button>'

  app.querySelectorAll('[data-l]').forEach((b) => b.onclick = () => answer(b.dataset.l))
  app.querySelectorAll('[data-skip]').forEach((b) => b.onclick = () => answer(null, 'skip'))
  const canon = document.getElementById('canon')
  if (canon) canon.querySelectorAll('button').forEach((b) => b.onclick = () => {
    corrected = corrected === b.dataset.v ? null : b.dataset.v
    canon.querySelectorAll('button').forEach((x) => x.classList.toggle('sel', x.dataset.v === corrected))
  })

  // ⚖️ THE FRAME THE HUMAN ENLARGES IS EVIDENCE ABOUT THE PACKET. Reaching for a
  // different frame means we showed the wrong one first, and that count is a
  // direct input to what #69 should change.
  app.querySelectorAll('.frames img').forEach((img) => img.onclick = () => {
    post('/event', { kind: 'frame_change' })
    img.style.maxHeight = img.style.maxHeight === 'none' ? '340px' : 'none'
  })
}

async function answer(label, kind) {
  const idx = rows.indexOf(rows[i])
  rows[i].label = label
  rows[i].correctedValue = corrected
  await post('/label', { index: idx, label, correctedValue: corrected, kind })
  i++
  render()
}

onkeydown = (e) => {
  if (i >= rows.length) return
  const n = Number(e.key)
  if (n >= 1 && n <= 4) answer(LABELS[n - 1][0])
  if (e.key === 's') answer(null, 'skip')
}
boot()
</script>
